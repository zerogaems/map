<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>دليل الكليات والقاعات</title>

  <!-- 1. مكتبة تلغرام -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- 2. مكتبة Leaflet للخرائط -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #ffffff);
      --text-color: var(--tg-theme-text-color, #222222);
      --button-color: var(--tg-theme-button-color, #2481cc);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
      --secondary-bg: var(--tg-theme-secondary-bg-color, #f4f4f5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .top-nav {
      display: flex;
      background-color: var(--secondary-bg);
      padding: 8px;
      gap: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      z-index: 1000;
    }

    .nav-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background-color: transparent;
      color: var(--text-color);
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .nav-btn.active {
      background-color: var(--button-color);
      color: var(--button-text);
    }

    .map-container {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
    }

    #outdoor-map {
      width: 100%;
      height: 100%;
    }

    #indoor-container {
      background-color: #0f172a;
    }

    .controls-panel {
      position: absolute;
      bottom: 15px;
      left: 15px;
      right: 15px;
      background-color: var(--bg-color);
      padding: 12px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .dropdown-group {
      display: flex;
      gap: 6px;
    }

    select, button.action-btn {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 12px;
      background-color: var(--secondary-bg);
      color: var(--text-color);
    }

    select { flex: 1; }

    .btn-row {
      display: flex;
      gap: 6px;
    }

    button.action-btn {
      flex: 1;
      background-color: var(--button-color);
      color: var(--button-text);
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    button.secondary-btn {
      background-color: var(--secondary-bg);
      color: var(--text-color);
      border: 1px solid #ccc;
    }

    #indoor-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>

  <!-- شريط التنقل العلوي -->
  <div class="top-nav">
    <button id="btn-outdoor" class="nav-btn active" onclick="switchView('outdoor')">الخارجية (الجامعة)</button>
    <button id="btn-indoor" class="nav-btn" onclick="switchView('indoor')">الداخلية (الكلية)</button>
  </div>

  <!-- الخريطة الخارجية -->
  <div id="outdoor-container" class="map-container">
    <div id="outdoor-map"></div>
    <div class="controls-panel">
      <div class="dropdown-group">
        <select id="building-select-outdoor" onchange="focusBuildingOnMap(this.value)">
          <option value="main">🚪 المدخل الرئيسي للجامعة</option>
          <option value="hamak">1. كلية الهمك</option>
          <option value="twasaa">2. مبنى التوسع</option>
          <option value="adab">3. كلية الآداب</option>
          <option value="uloom">4. كلية العلوم</option>
        </select>
      </div>
      <button class="action-btn" id="btn-locate" onclick="locateUser()">📍 حدد موقعي وارسم المسار</button>
    </div>
  </div>

  <!-- المخطط الداخلي المحدث -->
  <div id="indoor-container" class="map-container" style="display: none;">
    <canvas id="indoor-canvas"></canvas>
    
    <div class="controls-panel">
      <div class="dropdown-group">
        <select id="building-select-indoor" onchange="syncAndChangeBuilding(this.value)">
          <option value="twasaa">2. مبنى التوسع</option>
          <option value="hamak">1. كلية الهمك</option>
          <option value="adab">3. كلية الآداب</option>
          <option value="uloom">4. كلية العلوم</option>
        </select>

        <select id="floor-select" onchange="updateFloorsAndRooms()">
        </select>

        <select id="room-select" onchange="resetIndoorAnimation()">
        </select>
      </div>

      <div class="btn-row">
        <button class="action-btn" onclick="startIndoorNavigation()">انطلق نحو القاعة 🚶‍♂️</button>
        <button class="action-btn secondary-btn" style="flex: 0.35;" onclick="replayNavigation()">🔄 إعادة</button>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    function notify(message) {
      if (tg && tg.showAlert) {
        tg.showAlert(message);
      } else {
        alert(message);
      }
    }

    let map;
    let userMarker;
    let buildingMarkers = {};
    let routeLine;
    let isIndoorActive = false;

    // حدود المستطيل
    const southWest = L.latLng(35.51958875818877, 35.80444387688746);
    const northEast = L.latLng(35.52780824158785, 35.81065192458042);
    const campusBounds = L.latLngBounds(southWest, northEast);

    // قاعدة البيانات (الهمك 4 طوابق، الباقي أرضي فقط)
    const campusData = {
      main: { name: "المدخل الرئيسي للجامعة", lat: 35.52601940733772, lng: 35.806881711117235 },
      hamak: {
        name: "كلية الهمك",
        lat: 35.524735104049554,
        lng: 35.80832173303512,
        floors: {
          ground: { name: "الطابق الأرضي", rooms: ["21م", "22م", "23م"] },
          first:  { name: "الطابق الأول",   rooms: ["21ك", "22ك", "23ك", "44ك"] },
          second: { name: "الطابق الثاني",  rooms: ["مخبر الحاسوب 1", "مخبر الحاسوب 2"] },
          third:  { name: "الطابق الثالث",  rooms: ["قاعة الماجستير"] }
        }
      },
      twasaa: {
        name: "مبنى التوسع",
        lat: 35.52309984997797,
        lng: 35.809953816186045,
        floors: {
          ground: { name: "الطابق الأرضي", rooms: ["مدرج 1", "مدرج 2", "مدرج 3", "مدرج 4"] }
        }
      },
      adab: {
        name: "كلية الآداب",
        lat: 35.52142722934893,
        lng: 35.808531572615784,
        floors: {
          ground: { name: "الطابق الأرضي", rooms: ["مدرج 1", "مدرج 2", "ق1", "ق2"] }
        }
      },
      uloom: {
        name: "كلية العلوم",
        lat: 35.523082390509956,
        lng: 35.805570862320266,
        floors: {
          ground: { name: "الطابق الأرضي", rooms: ["مدرج 1", "مدرج 2", "مدرج 3", "مدرج 4"] }
        }
      }
    };

    /* -------------------------------------------------------------
       1. الخريطة الخارجية (LEAFLET MAP)
    ------------------------------------------------------------- */
    function initOutdoorMap() {
      map = L.map('outdoor-map', {
        maxBounds: campusBounds,
        maxBoundsViscosity: 0.5,
        minZoom: 16,
        maxZoom: 19
      }).setView([campusData.main.lat, campusData.main.lng], 17);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      }).addTo(map);

      Object.keys(campusData).forEach(key => {
        const item = campusData[key];
        const marker = L.marker([item.lat, item.lng]).addTo(map)
          .bindPopup(`<b>${item.name}</b>`);
        buildingMarkers[key] = marker;
      });

      buildingMarkers['main'].openPopup();
    }

    function locateUser() {
      const btn = document.getElementById('btn-locate');
      btn.innerText = "⏳ جاري تحديد الموقع...";

      if (!navigator.geolocation) {
        notify("خدمة الـ GPS غير مدعومة في متصفحك.");
        btn.innerText = "📍 حدد موقعي وارسم المسار";
        return;
      }

      const geoOptions = { timeout: 15000, maximumAge: 60000, enableHighAccuracy: false };

      navigator.geolocation.getCurrentPosition(
        position => {
          btn.innerText = "📍 حدد موقعي وارسم المسار";
          const userLat = position.coords.latitude;
          const userLng = position.coords.longitude;
          const userLatLng = L.latLng(userLat, userLng);

          if (!campusBounds.contains(userLatLng)) {
            notify("أنت حالياً خارج نطاق الحرم الجامعي! يمكنك استكشاف الخريطة والتنقل بين الكليات يدوياً.");
            return;
          }

          if (userMarker) map.removeLayer(userMarker);
          userMarker = L.marker([userLat, userLng]).addTo(map)
            .bindPopup('موقعك الحالي 📍').openPopup();

          const selectedBuildingKey = document.getElementById('building-select-outdoor').value;
          
          if (selectedBuildingKey && campusData[selectedBuildingKey]) {
            const target = campusData[selectedBuildingKey];
            drawRouteLine([userLat, userLng], [target.lat, target.lng]);

            const fitBounds = L.latLngBounds([[userLat, userLng], [target.lat, target.lng]]);
            map.fitBounds(fitBounds, { padding: [40, 40] });
          } else {
            map.setView([userLat, userLng], 18);
          }
        },
        error => {
          btn.innerText = "📍 حدد موقعي وارسم المسار";
          let errorMsg = "تعذر تحديد الموقع.";
          if (error.code === 1) errorMsg = "يرجى منح صلاحية الموقع للتطبيق في إعدادات الهاتف.";
          else if (error.code === 2) errorMsg = "إشارة الـ GPS ضعيفة حالياً، يرجى المحاولة في مكان مكشوف.";
          else if (error.code === 3) errorMsg = "استغرق تحديد الموقع وقتاً طويلاً، حاول مرة أخرى.";
          notify(errorMsg);
        },
        geoOptions
      );
    }

    function focusBuildingOnMap(key) {
      if (campusData[key]) {
        const target = campusData[key];

        if (userMarker) {
          const userLatLng = userMarker.getLatLng();
          drawRouteLine([userLatLng.lat, userLatLng.lng], [target.lat, target.lng]);

          const bounds = L.latLngBounds([[userLatLng.lat, userLatLng.lng], [target.lat, target.lng]]);
          map.fitBounds(bounds, { padding: [40, 40] });
        } else {
          map.flyTo([target.lat, target.lng], 18, { animate: true, duration: 0.8 });
        }

        buildingMarkers[key].openPopup();
      }
    }

    function drawRouteLine(fromLatLng, toLatLng) {
      if (routeLine) map.removeLayer(routeLine);

      routeLine = L.polyline([fromLatLng, toLatLng], {
        color: '#2481cc',
        weight: 4,
        dashArray: '8, 8',
        opacity: 0.8
      }).addTo(map);
    }

    function syncAndChangeBuilding(key) {
      document.getElementById('building-select-outdoor').value = key;
      focusBuildingOnMap(key);
      updateFloorsAndRooms();
    }

    function updateFloorsAndRooms() {
      const buildingKey = document.getElementById('building-select-indoor').value;
      const floorSelect = document.getElementById('floor-select');
      const roomSelect = document.getElementById('room-select');

      const buildingInfo = campusData[buildingKey];

      if (floorSelect.getAttribute('data-building') !== buildingKey) {
        floorSelect.innerHTML = '';
        floorSelect.setAttribute('data-building', buildingKey);

        Object.keys(buildingInfo.floors).forEach(fKey => {
          const opt = document.createElement('option');
          opt.value = fKey;
          opt.textContent = buildingInfo.floors[fKey].name;
          floorSelect.appendChild(opt);
        });
      }

      const currentFloorKey = floorSelect.value || Object.keys(buildingInfo.floors)[0];
      roomSelect.innerHTML = '';

      if (buildingInfo.floors[currentFloorKey]) {
        const rooms = buildingInfo.floors[currentFloorKey].rooms;
        rooms.forEach(room => {
          const option = document.createElement('option');
          option.value = room;
          option.textContent = room;
          roomSelect.appendChild(option);
        });
      }

      resetIndoorAnimation();
    }

    function switchView(view) {
      const outdoorContainer = document.getElementById('outdoor-container');
      const indoorContainer = document.getElementById('indoor-container');
      const btnOutdoor = document.getElementById('btn-outdoor');
      const btnIndoor = document.getElementById('btn-indoor');

      if (view === 'outdoor') {
        isIndoorActive = false;
        cancelAnimationFrame(animationFrameId);
        outdoorContainer.style.display = 'block';
        indoorContainer.style.display = 'none';
        btnOutdoor.classList.add('active');
        btnIndoor.classList.remove('active');
        setTimeout(() => map.invalidateSize(), 150);
      } else {
        isIndoorActive = true;
        outdoorContainer.style.display = 'none';
        indoorContainer.style.display = 'block';
        btnIndoor.classList.add('active');
        btnOutdoor.classList.remove('active');
        updateFloorsAndRooms();
      }
    }

    /* -------------------------------------------------------------
       2. المخطط الداخلي الهندسي لمبنى التوسع (TWASAA BLUEPRINT)
    ------------------------------------------------------------- */
    let animationFrameId;
    let avatarProgress = 0;
    let isNavigating = false;
    let currentPath = [];

    function resetIndoorAnimation() {
      cancelAnimationFrame(animationFrameId);
      avatarProgress = 0;
      isNavigating = false;
      drawIndoorCanvas();
    }

    function replayNavigation() {
      if (!document.getElementById('room-select').value) return;
      startIndoorNavigation();
    }

    function drawIndoorCanvas(avatarPos = null) {
      const canvas = document.getElementById('indoor-canvas');
      const ctx = canvas.getContext('2d');
      const buildingKey = document.getElementById('building-select-indoor').value;
      const selectedRoom = document.getElementById('room-select').value;

      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;

      const w = canvas.width;
      const h = canvas.height;

      // خلفية المخطط الداكنة
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, w, h);

      if (buildingKey === 'twasaa') {
        drawTwasaaLayout(ctx, w, h, selectedRoom, avatarPos);
      } else {
        // رسم افتراضي قياسي لباقي المباني
        drawDefaultLayout(ctx, w, h, selectedRoom, avatarPos);
      }

      // العنوان في الأعلى
      ctx.fillStyle = '#f8fafc';
      ctx.font = 'bold 15px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(`${campusData[buildingKey].name}`, w / 2, 28);
    }

    // رسم مبنى التوسع بدقة بناءً على الرسمة
    function drawTwasaaLayout(ctx, w, h, selectedRoom, avatarPos) {
      // إحداثيات الهندسة الرئيسية
      const entrance = { x: w * 0.50, y: h * 0.88 };
      const bottomCorridorY = h * 0.80;
      
      const garden = {
        x: w * 0.35,
        y: h * 0.45,
        width: w * 0.30,
        height: h * 0.30
      };

      const rightCorridorX = w * 0.78;
      const leftCorridorX = w * 0.22;
      const topCorridorY = h * 0.40;

      const narrowCorridorX = w * 0.50;
      const narrowCorridorYStart = h * 0.40;
      const narrowCorridorYEnd = h * 0.12;

      // 1. رسم الممرات العريضة باللون الرمادي الهندسي
      ctx.strokeStyle = '#334155';
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // ممر المدخل
      ctx.lineWidth = w * 0.08;
      ctx.beginPath();
      ctx.moveTo(entrance.x, entrance.y);
      ctx.lineTo(entrance.x, bottomCorridorY);
      ctx.stroke();

      // حلقة الممر حول الحديقة
      ctx.lineWidth = w * 0.07;
      ctx.beginPath();
      ctx.moveTo(leftCorridorX, bottomCorridorY);
      ctx.lineTo(rightCorridorX, bottomCorridorY);
      ctx.lineTo(rightCorridorX, topCorridorY);
      ctx.lineTo(leftCorridorX, topCorridorY);
      ctx.lineTo(leftCorridorX, bottomCorridorY);
      ctx.stroke();

      // الممر العلوي الضيق
      ctx.lineWidth = w * 0.05;
      ctx.beginPath();
      ctx.moveTo(narrowCorridorX, narrowCorridorYStart);
      ctx.lineTo(narrowCorridorX, narrowCorridorYEnd);
      ctx.stroke();

      // 2. رسم الحديقة العامة في المنتصف
      ctx.fillStyle = '#14532d';
      ctx.strokeStyle = '#22c55e';
      ctx.lineWidth = 2;
      ctx.fillRect(garden.x, garden.y, garden.width, garden.height);
      ctx.strokeRect(garden.x, garden.y, garden.width, garden.height);

      ctx.fillStyle = '#86efac';
      ctx.font = 'bold 13px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('حديقة عامة 🌿', garden.x + garden.width / 2, garden.y + garden.height / 2 + 4);

      // 3. رسم الممر الأيسر الفارغ
      ctx.fillStyle = '#64748b';
      ctx.font = '11px sans-serif';
      ctx.fillText('ممر عبور', leftCorridorX, h * 0.60);

      // 4. مواقع المدرجات الأربعة
      const rooms = [
        { name: "مدرج 1", x: w * 0.89, y: h * 0.72, doorY1: h * 0.70, doorY2: h * 0.74, sideX: rightCorridorX },
        { name: "مدرج 2", x: w * 0.89, y: h * 0.50, doorY1: h * 0.48, doorY2: h * 0.52, sideX: rightCorridorX },
        { name: "مدرج 3", x: w * 0.72, y: h * 0.32, doorY1: h * 0.32, doorY2: h * 0.32, sideX: narrowCorridorX },
        { name: "مدرج 4", x: w * 0.72, y: h * 0.18, doorY1: h * 0.18, doorY2: h * 0.18, sideX: narrowCorridorX }
      ];

      rooms.forEach(r => {
        const isTarget = (r.name === selectedRoom);
        const boxW = (r.name === "مدرج 3" || r.name === "مدرج 4") ? w * 0.22 : w * 0.16;
        const boxH = h * 0.10;

        // توصيلة الباب للممر
        ctx.strokeStyle = isTarget ? '#38bdf8' : '#1e293b';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(r.sideX, r.doorY1);
        ctx.lineTo(r.x, r.doorY1);
        ctx.stroke();

        // صندوق المدرج
        ctx.fillStyle = isTarget ? '#1e3a8a' : '#1e293b';
        ctx.strokeStyle = isTarget ? '#38bdf8' : '#475569';
        ctx.lineWidth = isTarget ? 2.5 : 1.5;

        ctx.fillRect(r.x - boxW / 2, r.y - boxH / 2, boxW, boxH);
        ctx.strokeRect(r.x - boxW / 2, r.y - boxH / 2, boxW, boxH);

        // اسم المدرج
        ctx.fillStyle = isTarget ? '#38bdf8' : '#94a3b8';
        ctx.font = isTarget ? 'bold 12px sans-serif' : '11px sans-serif';
        ctx.fillText(r.name, r.x, r.y + 4);
      });

      // 5. رسم المدخل الرئيسي
      ctx.fillStyle = '#22c55e';
      ctx.beginPath();
      ctx.arc(entrance.x, entrance.y, 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 11px sans-serif';
      ctx.fillText('المدخل 🚪', entrance.x, entrance.y + 20);

      // 6. رسم خط حركة المسار
      if (currentPath.length > 1 && isNavigating) {
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 4;
        ctx.setLineDash([5, 5]);
        ctx.beginPath();
        ctx.moveTo(currentPath[0].x, currentPath[0].y);
        for (let i = 1; i < currentPath.length; i++) {
          ctx.lineTo(currentPath[i].x, currentPath[i].y);
        }
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // 7. رسم شخصية الطالب
      const drawPos = avatarPos || entrance;
      ctx.fillStyle = '#38bdf8';
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(drawPos.x, drawPos.y, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    // رسم افتراضي مبسط للباقي
    function drawDefaultLayout(ctx, w, h, selectedRoom, avatarPos) {
      const centerX = w * 0.5;
      const corridorY = h * 0.5;
      const entrance = { x: centerX, y: h * 0.85 };

      ctx.strokeStyle = '#334155';
      ctx.lineWidth = w * 0.08;
      ctx.beginPath();
      ctx.moveTo(entrance.x, entrance.y);
      ctx.lineTo(centerX, corridorY);
      ctx.moveTo(w * 0.2, corridorY);
      ctx.lineTo(w * 0.8, corridorY);
      ctx.stroke();

      const drawPos = avatarPos || entrance;
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.arc(drawPos.x, drawPos.y, 8, 0, Math.PI * 2);
      ctx.fill();
    }

    function startIndoorNavigation() {
      const buildingKey = document.getElementById('building-select-indoor').value;
      const selectedRoom = document.getElementById('room-select').value;
      const canvas = document.getElementById('indoor-canvas');
      const w = canvas.width;
      const h = canvas.height;

      if (!selectedRoom) {
        notify("يرجى اختيار القاعة أولاً.");
        return;
      }

      // حساب المسار لمبنى التوسع بناءً على الرسمة
      if (buildingKey === 'twasaa') {
        const entrance = { x: w * 0.50, y: h * 0.88 };
        const bottomJunction = { x: w * 0.50, y: h * 0.80 };
        const rightJunctionBottom = { x: w * 0.78, y: h * 0.80 };
        const rightJunctionTop = { x: w * 0.78, y: h * 0.40 };
        const narrowJunction = { x: w * 0.50, y: h * 0.40 };

        if (selectedRoom === "مدرج 1") {
          currentPath = [
            entrance,
            bottomJunction,
            rightJunctionBottom,
            { x: w * 0.78, y: h * 0.70 },
            { x: w * 0.89, y: h * 0.70 }
          ];
        } else if (selectedRoom === "مدرج 2") {
          currentPath = [
            entrance,
            bottomJunction,
            rightJunctionBottom,
            { x: w * 0.78, y: h * 0.50 },
            { x: w * 0.89, y: h * 0.50 }
          ];
        } else if (selectedRoom === "مدرج 3") {
          currentPath = [
            entrance,
            bottomJunction,
            rightJunctionBottom,
            rightJunctionTop,
            narrowJunction,
            { x: w * 0.50, y: h * 0.32 },
            { x: w * 0.72, y: h * 0.32 }
          ];
        } else if (selectedRoom === "مدرج 4") {
          currentPath = [
            entrance,
            bottomJunction,
            rightJunctionBottom,
            rightJunctionTop,
            narrowJunction,
            { x: w * 0.50, y: h * 0.18 },
            { x: w * 0.72, y: h * 0.18 }
          ];
        }
      }

      avatarProgress = 0;
      isNavigating = true;

      cancelAnimationFrame(animationFrameId);
      animateAvatar();
    }

    function animateAvatar() {
      avatarProgress += 0.004; // السرعة الهادئة

      if (avatarProgress >= 1) {
        avatarProgress = 1;
        isNavigating = false;
        const selectedRoom = document.getElementById('room-select').value;
        const currentPos = getPointOnPath(currentPath, 1);
        drawIndoorCanvas(currentPos);
        notify(`وصلت بنجاح إلى [${selectedRoom}] 🎯`);
        return;
      }

      const currentPos = getPointOnPath(currentPath, avatarProgress);
      drawIndoorCanvas(currentPos);

      animationFrameId = requestAnimationFrame(animateAvatar);
    }

    function getPointOnPath(path, t) {
      if (path.length < 2) return path[0];

      let totalDist = 0;
      let dists = [];

      for (let i = 0; i < path.length - 1; i++) {
        let d = Math.hypot(path[i + 1].x - path[i].x, path[i + 1].y - path[i].y);
        dists.push(d);
        totalDist += d;
      }

      let travel = t * totalDist;

      for (let i = 0; i < dists.length; i++) {
        if (travel <= dists[i]) {
          let segmentT = travel / dists[i];
          return {
            x: path[i].x + (path[i + 1].x - path[i].x) * segmentT,
            y: path[i].y + (path[i + 1].y - path[i].y) * segmentT
          };
        }
        travel -= dists[i];
      }

      return path[path.length - 1];
    }

    window.onload = function() {
      initOutdoorMap();
    };
  </script>
</body>
