<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>دليل الكليات الاحترافي</title>

  <!-- Telegram Web App JS -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Leaflet Map JS & CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #ffffff);
      --text-color: var(--tg-theme-text-color, #222222);
      --button-color: var(--tg-theme-button-color, #2481cc);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
      --secondary-bg: var(--tg-theme-secondary-bg-color, #f4f4f5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    .top-nav { display: flex; background-color: var(--secondary-bg); padding: 6px; gap: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); z-index: 1000; }
    .nav-btn { flex: 1; padding: 8px; border: none; border-radius: 8px; background: transparent; color: var(--text-color); font-weight: bold; font-size: 13px; cursor: pointer; }
    .nav-btn.active { background-color: var(--button-color); color: var(--button-text); }

    .map-container { flex: 1; width: 100%; height: 100%; position: relative; }
    #outdoor-map { width: 100%; height: 100%; }
    #indoor-container { background-color: #0f172a; }

    .controls-panel {
      position: absolute; bottom: 10px; left: 10px; right: 10px;
      background-color: #1e293b; color: #ffffff; padding: 10px; border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5); border: 1px solid #334155; z-index: 1000; display: flex; flex-direction: column; gap: 6px;
    }

    .dropdown-group { display: flex; gap: 4px; }
    select, button.action-btn { padding: 8px; border-radius: 6px; border: 1px solid #475569; font-size: 11px; background-color: #0f172a; color: #f8fafc; }
    select { flex: 1; }

    .btn-row { display: flex; gap: 6px; }
    button.action-btn { flex: 1; background-color: var(--button-color); color: var(--button-text); border: none; font-weight: bold; cursor: pointer; }
    button.secondary-btn { background-color: #334155; color: #ffffff; border: 1px solid #475569; }

    #indoor-canvas { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>

  <!-- شريط التنقل العلوي -->
  <div class="top-nav">
    <button id="btn-outdoor" class="nav-btn active" onclick="switchView('outdoor')">الخارجية (الجامعة)</button>
    <button id="btn-indoor" class="nav-btn" onclick="switchView('indoor')">الداخلية (الكلية)</button>
  </div>

  <!-- الخريطة الخارجية -->
  <div id="outdoor-container" class="map-container">
    <div id="outdoor-map"></div>
    <div class="controls-panel">
      <div class="dropdown-group">
        <select id="building-select-outdoor" onchange="focusBuildingOnMap(this.value)">
          <option value="main">🚪 المدخل الرئيسي للجامعة</option>
          <option value="uloom">4. كلية العلوم</option>
          <option value="twasaa">2. مبنى التوسع</option>
          <option value="adab">3. كلية الآداب</option>
          <option value="hamak">1. كلية الهمك</option>
        </select>
      </div>
      <button class="action-btn" id="btn-locate" onclick="locateUser()">📍 حدد موقعي وارسم المسار</button>
    </div>
  </div>

  <!-- المخطط الداخلي الموحد -->
  <div id="indoor-container" class="map-container" style="display: none;">
    <canvas id="indoor-canvas"></canvas>
    
    <div class="controls-panel">
      <div class="dropdown-group">
        <select id="building-select-indoor" onchange="syncAndChangeBuilding(this.value)">
          <option value="uloom">4. كلية العلوم</option>
          <option value="twasaa">2. مبنى التوسع</option>
          <option value="adab">3. كلية الآداب</option>
          <option value="hamak">1. كلية الهمك</option>
        </select>

        <select id="floor-select" onchange="updateFloorsAndRooms()">
        </select>

        <select id="room-select" onchange="resetIndoorAnimation()">
        </select>
      </div>

      <div class="btn-row">
        <button class="action-btn" onclick="startIndoorNavigation()">انطلق نحو القاعة 🚶‍♂️</button>
        <button class="action-btn secondary-btn" style="flex: 0.35;" onclick="replayNavigation()">🔄 إعادة</button>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready(); tg.expand();

    function notify(msg) { if (tg && tg.showAlert) tg.showAlert(msg); else alert(msg); }

    let map, userMarker, routeLine;
    let buildingMarkers = {};

    const southWest = L.latLng(35.51958875818877, 35.80444387688746);
    const northEast = L.latLng(35.52780824158785, 35.81065192458042);
    const campusBounds = L.latLngBounds(southWest, northEast);

    const campusData = {
      main: { name: "المدخل الرئيسي للجامعة", lat: 35.52601940733772, lng: 35.806881711117235, node: "N_MAIN" },
      uloom: {
        name: "كلية العلوم", lat: 35.523082390509956, lng: 35.805570862320266, node: "N_ULOOM",
        floors: { ground: { name: "الطابق الأرضي", rooms: ["المدرج الرابع"] } }
      },
      twasaa: {
        name: "مبنى التوسع", lat: 35.52309984997797, lng: 35.809953816186045, node: "N_TWASAA",
        floors: { ground: { name: "الطابق الأرضي", rooms: ["مدرج 1", "مدرج 2", "مدرج 3", "مدرج 4"] } }
      },
      adab: {
        name: "كلية الآداب", lat: 35.52142722934893, lng: 35.808531572615784, node: "N_ADAB",
        floors: {
          ground: { name: "الطابق الأرضي", rooms: ["مدرج 1", "مدرج 2", "ق1", "ق2"] },
          basement: { name: "طابق القبو", rooms: ["ق1", "ق2"] }
        }
      },
      hamak: {
        name: "كلية الهمك", lat: 35.524735104049554, lng: 35.80832173303512, node: "N_HAMAK",
        floors: {
          ground: { name: "الطابق الأرضي", rooms: ["بي 1", "بي 2", "شؤون الطلاب", "مركز الدعم", "مكتب الهيئة"] }
        }
      }
    };

    /* -------------------------------------------------------------
       شبكة الشوارع الخارجية وخوارزمية DIJKSTRA
    ------------------------------------------------------------- */
    const campusNodes = {
      "N_MAIN":   { lat: 35.526019, lng: 35.806881 },
      "N_PLAZA":  { lat: 35.524800, lng: 35.807300 },
      "N_HAMAK":  { lat: 35.524735, lng: 35.808321 },
      "N_ULOOM":  { lat: 35.523082, lng: 35.805570 },
      "N_CENTER": { lat: 35.523100, lng: 35.807500 },
      "N_TWASAA": { lat: 35.523099, lng: 35.809953 },
      "N_ADAB":   { lat: 35.521427, lng: 35.808531 }
    };

    const campusEdges = [
      ["N_MAIN", "N_PLAZA"],
      ["N_PLAZA", "N_HAMAK"],
      ["N_PLAZA", "N_CENTER"],
      ["N_CENTER", "N_ULOOM"],
      ["N_CENTER", "N_TWASAA"],
      ["N_CENTER", "N_ADAB"],
      ["N_HAMAK", "N_TWASAA"],
      ["N_TWASAA", "N_ADAB"]
    ];

    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function findNearestNode(lat, lng) {
      let nearest = null, minDist = Infinity;
      Object.keys(campusNodes).forEach(id => {
        let d = getDistance(lat, lng, campusNodes[id].lat, campusNodes[id].lng);
        if (d < minDist) { minDist = d; nearest = id; }
      });
      return nearest;
    }

    function dijkstraPath(startNode, endNode) {
      let graph = {};
      Object.keys(campusNodes).forEach(n => graph[n] = {});
      campusEdges.forEach(([u, v]) => {
        let dist = getDistance(campusNodes[u].lat, campusNodes[u].lng, campusNodes[v].lat, campusNodes[v].lng);
        graph[u][v] = dist; graph[v][u] = dist;
      });

      let distances = {}, previous = {}, unvisited = new Set(Object.keys(campusNodes));
      Object.keys(campusNodes).forEach(n => distances[n] = Infinity);
      distances[startNode] = 0;

      while (unvisited.size > 0) {
        let current = null;
        unvisited.forEach(n => { if (!current || distances[n] < distances[current]) current = n; });

        if (current === endNode || distances[current] === Infinity) break;
        unvisited.delete(current);

        Object.keys(graph[current]).forEach(neighbor => {
          if (unvisited.has(neighbor)) {
            let alt = distances[current] + graph[current][neighbor];
            if (alt < distances[neighbor]) { distances[neighbor] = alt; previous[neighbor] = current; }
          }
        });
      }

      let path = [], curr = endNode;
      while (curr) { path.unshift(curr); curr = previous[curr]; }
      return path;
    }

    /* -------------------------------------------------------------
       الخريطة الخارجية (LEAFLET)
    ------------------------------------------------------------- */
    function initOutdoorMap() {
      map = L.map('outdoor-map', { maxBounds: campusBounds, minZoom: 16, maxZoom: 19 }).setView([campusData.main.lat, campusData.main.lng], 17);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
      Object.keys(campusData).forEach(k => {
        buildingMarkers[k] = L.marker([campusData[k].lat, campusData[k].lng]).addTo(map).bindPopup(`<b>${campusData[k].name}</b>`);
      });
    }

    function locateUser() {
      const btn = document.getElementById('btn-locate');
      btn.innerText = "⏳ جاري تحديد الموقع...";
      navigator.geolocation.getCurrentPosition(
        pos => {
          btn.innerText = "📍 حدد موقعي وارسم المسار";
          const uLat = pos.coords.latitude, uLng = pos.coords.longitude;
          if (userMarker) map.removeLayer(userMarker);
          userMarker = L.marker([uLat, uLng]).addTo(map).bindPopup('موقعك الحالي 📍').openPopup();

          const bKey = document.getElementById('building-select-outdoor').value;
          if (bKey && campusData[bKey]) {
            drawSmartOutdoorRoute([uLat, uLng], campusData[bKey].node, campusData[bKey]);
          }
        },
        () => { btn.innerText = "📍 حدد موقعي وارسم المسار"; notify("تعذر تحديد الموقع. يرجى تفعيل إذن الموقع الـ GPS."); }
      );
    }

    function drawSmartOutdoorRoute(userCoords, targetNode, targetInfo) {
      const nearestNode = findNearestNode(userCoords[0], userCoords[1]);
      const nodePath = dijkstraPath(nearestNode, targetNode);

      let polyPoints = [userCoords];
      nodePath.forEach(nId => polyPoints.push([campusNodes[nId].lat, campusNodes[nId].lng]));
      polyPoints.push([targetInfo.lat, targetInfo.lng]);

      if (routeLine) map.removeLayer(routeLine);
      routeLine = L.polyline(polyPoints, { color: '#2481cc', weight: 5, dashArray: '6, 6' }).addTo(map);
      map.fitBounds(routeLine.getBounds(), { padding: [30, 30] });
    }

    function focusBuildingOnMap(k) {
      if (campusData[k]) {
        if (userMarker) drawSmartOutdoorRoute([userMarker.getLatLng().lat, userMarker.getLatLng().lng], campusData[k].node, campusData[k]);
        else map.flyTo([campusData[k].lat, campusData[k].lng], 18);
        buildingMarkers[k].openPopup();
      }
    }

    function syncAndChangeBuilding(k) {
      document.getElementById('building-select-outdoor').value = k;
      updateFloorsAndRooms();
    }

    function updateFloorsAndRooms() {
      const bKey = document.getElementById('building-select-indoor').value;
      const fSel = document.getElementById('floor-select');
      const rSel = document.getElementById('room-select');
      const bInfo = campusData[bKey];

      if (fSel.getAttribute('data-building') !== bKey) {
        fSel.innerHTML = ''; fSel.setAttribute('data-building', bKey);
        Object.keys(bInfo.floors).forEach(f => {
          let opt = document.createElement('option'); opt.value = f; opt.textContent = bInfo.floors[f].name; fSel.appendChild(opt);
        });
      }

      const fKey = fSel.value || Object.keys(bInfo.floors)[0];
      rSel.innerHTML = '';
      if (bInfo.floors[fKey]) {
        bInfo.floors[fKey].rooms.forEach(r => {
          let opt = document.createElement('option'); opt.value = r; opt.textContent = r; rSel.appendChild(opt);
        });
      }
      resetIndoorAnimation();
    }

    function switchView(view) {
      document.getElementById('outdoor-container').style.display = (view === 'outdoor') ? 'block' : 'none';
      document.getElementById('indoor-container').style.display = (view === 'indoor') ? 'block' : 'none';
      document.getElementById('btn-outdoor').classList.toggle('active', view === 'outdoor');
      document.getElementById('btn-indoor').classList.toggle('active', view === 'indoor');
      if (view === 'indoor') updateFloorsAndRooms();
      else setTimeout(() => map.invalidateSize(), 150);
    }

    /* -------------------------------------------------------------
       المخططات الداخلية الرسم والملاحة (CANVAS MAPS)
    ------------------------------------------------------------- */
    let animationFrameId, avatarProgress = 0, isNavigating = false, currentPath = [];
    let isCrossFloorJourney = false, targetRoomGlobal = "";

    function resetIndoorAnimation() {
      cancelAnimationFrame(animationFrameId);
      avatarProgress = 0; isNavigating = false; isCrossFloorJourney = false;
      drawIndoorCanvas();
    }

    function replayNavigation() { startIndoorNavigation(); }

    function drawIndoorCanvas(avatarPos = null) {
      const canvas = document.getElementById('indoor-canvas');
      const ctx = canvas.getContext('2d');
      const bKey = document.getElementById('building-select-indoor').value;
      const fKey = document.getElementById('floor-select').value || 'ground';
      const selectedRoom = document.getElementById('room-select').value;

      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
      const w = canvas.width, h = canvas.height;

      ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, w, h);

      if (bKey === 'uloom') drawUloom(ctx, w, h, selectedRoom, avatarPos);
      else if (bKey === 'adab') drawAdab(ctx, w, h, fKey, selectedRoom, avatarPos);
      else if (bKey === 'twasaa') drawTwasaa(ctx, w, h, selectedRoom, avatarPos);
      else if (bKey === 'hamak') drawHamak(ctx, w, h, selectedRoom, avatarPos);

      ctx.fillStyle = '#f8fafc'; ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(`${campusData[bKey].name} - ${campusData[bKey].floors[fKey]?.name || ''}`, w / 2, 28);
    }

    // --- كلية العلوم ---
    function drawUloom(ctx, w, h, selectedRoom, avatarPos) {
      const entrance = { x: w * 0.30, y: h * 0.70 };
      ctx.strokeStyle = '#334155'; ctx.lineCap = 'round'; ctx.lineJoin = 'round';

      ctx.lineWidth = w * 0.06;
      ctx.beginPath(); ctx.moveTo(entrance.x, entrance.y); ctx.lineTo(entrance.x, h * 0.62); ctx.stroke();
      ctx.beginPath(); ctx.strokeRect(w * 0.16, h * 0.48, w * 0.38, h * 0.14);

      const bottomGarden = { x: w * 0.22, y: h * 0.50, w: w * 0.26, h: h * 0.10 };
      ctx.fillStyle = '#14532d'; ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 1.5;
      ctx.fillRect(bottomGarden.x, bottomGarden.y, bottomGarden.w, bottomGarden.h);
      ctx.strokeRect(bottomGarden.x, bottomGarden.y, bottomGarden.w, bottomGarden.h);
      ctx.fillStyle = '#86efac'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('حديقة 🌿', bottomGarden.x + bottomGarden.w/2, bottomGarden.y + bottomGarden.h/2 + 4);

      ctx.fillStyle = '#1e293b'; ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 1;
      ctx.fillRect(w * 0.56, h * 0.58, 60, 20); ctx.strokeRect(w * 0.56, h * 0.58, 60, 20);
      ctx.fillStyle = '#38bdf8'; ctx.font = '9px sans-serif'; ctx.fillText('تصوير 🖨️', w * 0.56 + 30, h * 0.58 + 13);

      ctx.fillStyle = '#1e293b'; ctx.strokeStyle = '#f59e0b';
      ctx.fillRect(w * 0.56, h * 0.48, 60, 20); ctx.strokeRect(w * 0.56, h * 0.48, 60, 20);
      ctx.fillStyle = '#f59e0b'; ctx.fillText('كافيه ☕', w * 0.56 + 30, h * 0.48 + 13);

      ctx.strokeStyle = '#334155'; ctx.lineWidth = w * 0.06;
      ctx.beginPath(); ctx.moveTo(w * 0.50, h * 0.48); ctx.lineTo(w * 0.50, h * 0.34); ctx.stroke();
      drawStair(ctx, w * 0.47, h * 0.40, 22, 14, 'درج 1');

      ctx.beginPath(); ctx.moveTo(w * 0.28, h * 0.34); ctx.lineTo(w * 0.72, h * 0.34); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(w * 0.28, h * 0.22); ctx.lineTo(w * 0.72, h * 0.22); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(w * 0.28, h * 0.34); ctx.lineTo(w * 0.28, h * 0.22); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(w * 0.72, h * 0.34); ctx.lineTo(w * 0.72, h * 0.22); ctx.stroke();

      drawStair(ctx, w * 0.47, h * 0.27, 24, 14, 'درج 2');

      ctx.fillStyle = '#0284c7'; ctx.fillRect(w * 0.32, h * 0.18, 32, 15);
      ctx.fillStyle = '#ffffff'; ctx.font = '8px sans-serif'; ctx.fillText('🚹 ذكور', w * 0.32 + 16, h * 0.18 + 11);
      ctx.fillStyle = '#ec4899'; ctx.fillRect(w * 0.54, h * 0.18, 32, 15);
      ctx.fillStyle = '#ffffff'; ctx.fillText('🚺 إناث', w * 0.54 + 16, h * 0.18 + 11);

      ctx.strokeStyle = '#334155'; ctx.lineWidth = w * 0.06;
      ctx.beginPath(); ctx.moveTo(w * 0.72, h * 0.22); ctx.lineTo(w * 0.72, h * 0.10); ctx.stroke();
      drawStair(ctx, w * 0.70, h * 0.15, 15, 18, 'درج 3');

      ctx.beginPath(); ctx.moveTo(w * 0.72, h * 0.10); ctx.lineTo(w * 0.30, h * 0.10); ctx.stroke();

      let isT = (selectedRoom === "المدرج الرابع");
      ctx.fillStyle = isT ? '#1e3a8a' : '#1e293b'; ctx.strokeStyle = isT ? '#38bdf8' : '#475569'; ctx.lineWidth = isT ? 2 : 1;
      ctx.fillRect(w * 0.30, h * 0.05, 80, 30); ctx.strokeRect(w * 0.30, h * 0.05, 80, 30);
      ctx.fillStyle = isT ? '#38bdf8' : '#94a3b8'; ctx.font = 'bold 12px sans-serif';
      ctx.fillText('المدرج الرابع 🎯', w * 0.30 + 40, h * 0.05 + 19);

      ctx.fillStyle = '#22c55e'; ctx.beginPath(); ctx.arc(entrance.x, entrance.y, 8, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.font = 'bold 11px sans-serif'; ctx.fillText('المدخل 🚪', entrance.x, entrance.y + 18);

      drawAvatarAndPath(ctx, entrance, avatarPos);
    }

    // --- كلية الآداب ---
    function drawAdab(ctx, w, h, fKey, selectedRoom, avatarPos) {
      if (fKey === 'ground') {
        const entrance = { x: w * 0.50, y: h * 0.70 };
        const stubY = h * 0.64;
        const mainCorridorX = w * 0.58;
        const squareLeftX = w * 0.30;
        const squareBottomY = h * 0.54;
        const squareTopY = h * 0.38;

        ctx.strokeStyle = '#334155'; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.lineWidth = w * 0.05;
        ctx.beginPath(); ctx.moveTo(entrance.x, entrance.y); ctx.lineTo(entrance.x, stubY); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(w * 0.40, stubY); ctx.lineTo(w * 0.60, stubY); ctx.stroke();

        ctx.strokeStyle = '#f43f5e'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(w * 0.40, stubY - 6); ctx.lineTo(w * 0.40, stubY + 6); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(w * 0.60, stubY - 6); ctx.lineTo(w * 0.60, stubY + 6); ctx.stroke();

        ctx.strokeStyle = '#334155'; ctx.lineWidth = w * 0.05;
        ctx.beginPath(); ctx.moveTo(entrance.x, stubY); ctx.lineTo(mainCorridorX, stubY); ctx.lineTo(mainCorridorX, h * 0.12); ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(mainCorridorX, squareBottomY); ctx.lineTo(squareLeftX, squareBottomY);
        ctx.lineTo(squareLeftX, squareTopY); ctx.lineTo(mainCorridorX, squareTopY);
        ctx.stroke();

        ctx.fillStyle = '#0284c7'; ctx.fillRect(squareLeftX + 10, squareBottomY - 18, 30, 15);
        ctx.fillStyle = '#ffffff'; ctx.font = '8px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('🚹', squareLeftX + 25, squareBottomY - 7);
        ctx.fillStyle = '#ec4899'; ctx.fillRect(squareLeftX + 45, squareBottomY - 18, 30, 15);
        ctx.fillStyle = '#ffffff'; ctx.fillText('🚺', squareLeftX + 60, squareBottomY - 7);

        ctx.fillStyle = '#1e293b'; ctx.strokeStyle = '#64748b'; ctx.lineWidth = 1;
        ctx.fillRect(squareLeftX + 20, squareTopY + 12, 50, 20); ctx.strokeRect(squareLeftX + 20, squareTopY + 12, 50, 20);
        ctx.fillStyle = '#94a3b8'; ctx.font = '8px sans-serif'; ctx.fillText('مكاتب 🏢', squareLeftX + 45, squareTopY + 25);

        let isH1 = (selectedRoom === "مدرج 1");
        ctx.fillStyle = isH1 ? '#1e3a8a' : '#1e293b'; ctx.strokeStyle = isH1 ? '#38bdf8' : '#475569'; ctx.lineWidth = isH1 ? 2 : 1;
        ctx.fillRect(mainCorridorX + 15, h * 0.44, 55, 30); ctx.strokeRect(mainCorridorX + 15, h * 0.44, 55, 30);
        ctx.fillStyle = isH1 ? '#38bdf8' : '#94a3b8'; ctx.font = isH1 ? 'bold 11px sans-serif' : '10px sans-serif';
        ctx.fillText('مدرج 1 🎯', mainCorridorX + 42, h * 0.44 + 18);

        let isH2 = (selectedRoom === "مدرج 2");
        ctx.fillStyle = isH2 ? '#1e3a8a' : '#1e293b'; ctx.strokeStyle = isH2 ? '#38bdf8' : '#475569'; ctx.lineWidth = isH2 ? 2 : 1;
        ctx.fillRect(squareLeftX - 58, squareTopY - 5, 50, 30); ctx.strokeRect(squareLeftX - 58, squareTopY - 5, 50, 30);
        ctx.fillStyle = isH2 ? '#38bdf8' : '#94a3b8'; ctx.font = isH2 ? 'bold 11px sans-serif' : '10px sans-serif';
        ctx.fillText('مدرج 2 🎯', squareLeftX - 33, squareTopY + 13);

        ctx.fillStyle = '#1e293b'; ctx.strokeStyle = '#64748b'; ctx.lineWidth = 1;
        ctx.fillRect(mainCorridorX + 12, h * 0.26, 45, 20); ctx.strokeRect(mainCorridorX + 12, h * 0.26, 45, 20);
        ctx.fillStyle = '#94a3b8'; ctx.font = '8px sans-serif'; ctx.fillText('تصوير 🖨️', mainCorridorX + 34, h * 0.26 + 13);

        ctx.fillStyle = '#1e293b'; ctx.strokeStyle = '#64748b';
        ctx.fillRect(mainCorridorX - 35, h * 0.18, 25, 25); ctx.strokeRect(mainCorridorX - 35, h * 0.18, 25, 25);
        ctx.fillStyle = '#94a3b8'; ctx.font = '8px sans-serif'; ctx.fillText('كافيه ☕', mainCorridorX - 22, h * 0.18 + 15);

        ctx.fillStyle = '#581c87'; ctx.strokeStyle = '#a855f7'; ctx.lineWidth = 2;
        ctx.fillRect(mainCorridorX - 22, h * 0.08, 44, 28); ctx.strokeRect(mainCorridorX - 22, h * 0.08, 44, 28);
        ctx.fillStyle = '#c084fc'; ctx.font = 'bold 10px sans-serif'; ctx.fillText('درج القبو 🪜', mainCorridorX, h * 0.08 + 17);

        ctx.fillStyle = '#22c55e'; ctx.beginPath(); ctx.arc(entrance.x, entrance.y, 8, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 11px sans-serif'; ctx.fillText('المدخل 🚪', entrance.x, entrance.y + 18);

        drawAvatarAndPath(ctx, entrance, avatarPos);
      } else {
        const stairPos = { x: w * 0.50, y: h * 0.82 };
        ctx.strokeStyle = '#334155'; ctx.lineWidth = w * 0.06; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(stairPos.x, stairPos.y); ctx.lineTo(stairPos.x, h*0.45); ctx.lineTo(w*0.68, h*0.45); ctx.stroke();
        ctx.beginPath(); ctx.strokeRect(w*0.68, h*0.20, w*0.24, h*0.38);

        ctx.fillStyle = '#14532d'; ctx.strokeStyle = '#22c55e'; ctx.fillRect(w*0.72, h*0.26, w*0.16, h*0.22);
        ctx.fillStyle = '#86efac'; ctx.font = '8px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('حديقة 🌿', w*0.80, h*0.37);

        let q1 = (selectedRoom === "ق1"), q2 = (selectedRoom === "ق2");
        ctx.fillStyle = q1 ? '#1e3a8a' : '#1e293b'; ctx.strokeStyle = q1 ? '#38bdf8' : '#475569'; ctx.lineWidth = q1 ? 2 : 1;
        ctx.fillRect(w*0.70, h*0.58, 45, 22); ctx.strokeRect(w*0.70, h*0.58, 45, 22);
        ctx.fillStyle = q1 ? '#38bdf8' : '#94a3b8'; ctx.font = 'bold 10px sans-serif'; ctx.fillText('ق1 🎯', w*0.70+22, h*0.58+15);

        ctx.fillStyle = q2 ? '#1e3a8a' : '#1e293b'; ctx.strokeStyle = q2 ? '#38bdf8' : '#475569'; ctx.lineWidth = q2 ? 2 : 1;
        ctx.fillRect(w*0.88, h*0.28, 22, 45); ctx.strokeRect(w*0.88, h*0.28, 22, 45);
        ctx.fillStyle = q2 ? '#38bdf8' : '#94a3b8'; ctx.font = 'bold 10px sans-serif'; ctx.fillText('ق2 🎯', w*0.88+11, h*0.28+25);

        ctx.fillStyle = '#a855f7'; ctx.beginPath(); ctx.arc(stairPos.x, stairPos.y, 8, 0, Math.PI*2); ctx.fill();
        drawAvatarAndPath(ctx, stairPos, avatarPos);
      }
    }

    // --- مبنى التوسع ---
    function drawTwasaa(ctx, w, h, selectedRoom, avatarPos) {
      const entrance = { x: w * 0.50, y: h * 0.65 };
      ctx.strokeStyle = '#334155'; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.lineWidth = w * 0.08; ctx.beginPath(); ctx.moveTo(entrance.x, entrance.y); ctx.lineTo(entrance.x, h*0.58); ctx.stroke();
      ctx.lineWidth = w * 0.07; ctx.beginPath(); ctx.strokeRect(w*0.22, h*0.32, w*0.56, h*0.26);
      ctx.lineWidth = w * 0.05; ctx.beginPath(); ctx.moveTo(w*0.5, h*0.32); ctx.lineTo(w*0.5, h*0.08); ctx.stroke();

      const g = { x: w * 0.34, y: h * 0.36, w: w * 0.32, h: h * 0.18 };
      ctx.fillStyle = '#14532d'; ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 2;
      ctx.fillRect(g.x, g.y, g.w, g.h); ctx.strokeRect(g.x, g.y, g.w, g.h);
      ctx.fillStyle = '#86efac'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('حديقة عامة 🌿', g.x + g.w/2, g.y + g.h/2 + 4);

      const rooms = [
        { name: "مدرج 1", x: w * 0.88, y: h * 0.52 }, { name: "مدرج 2", x: w * 0.88, y: h * 0.38 },
        { name: "مدرج 3", x: w * 0.72, y: h * 0.24 }, { name: "مدرج 4", x: w * 0.72, y: h * 0.12 }
      ];
      rooms.forEach(r => {
        let isT = (r.name === selectedRoom);
        ctx.fillStyle = isT ? '#1e3a8a' : '#1e293b'; ctx.strokeStyle = isT ? '#38bdf8' : '#475569';
        ctx.fillRect(r.x-30, r.y-14, 60, 28); ctx.strokeRect(r.x-30, r.y-14, 60, 28);
        ctx.fillStyle = isT ? '#38bdf8' : '#94a3b8'; ctx.font = 'bold 11px sans-serif'; ctx.fillText(r.name, r.x, r.y+4);
      });
      drawAvatarAndPath(ctx, entrance, avatarPos);
    }

    // --- كلية الهمك ---
    function drawHamak(ctx, w, h, selectedRoom, avatarPos) {
      const entrance = { x: w * 0.08, y: h * 0.35 };
      ctx.strokeStyle = '#334155'; ctx.lineWidth = w * 0.05; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(entrance.x, entrance.y); ctx.lineTo(w*0.15, entrance.y); ctx.stroke();
      ctx.beginPath(); ctx.strokeRect(w*0.15, h*0.15, w*0.13, h*0.35);
      ctx.beginPath(); ctx.moveTo(w*0.28, h*0.35); ctx.lineTo(w*0.68, h*0.35); ctx.stroke();
      ctx.beginPath(); ctx.strokeRect(w*0.68, h*0.15, w*0.24, h*0.40);

      const rooms = [
        { name: "بي 1", x: w*0.62, y: h*0.20 }, { name: "بي 2", x: w*0.62, y: h*0.28 },
        { name: "شؤون الطلاب", x: w*0.75, y: h*0.10 }, { name: "مركز الدعم", x: w*0.75, y: h*0.58 },
        { name: "مكتب الهيئة", x: w*0.40, y: h*0.28 }
      ];
      rooms.forEach(r => {
        let isT = (r.name === selectedRoom);
        ctx.fillStyle = isT ? '#1e3a8a' : '#1e293b'; ctx.strokeStyle = isT ? '#38bdf8' : '#475569';
        ctx.fillRect(r.x-25, r.y-10, 50, 20); ctx.strokeRect(r.x-25, r.y-10, 50, 20);
        ctx.fillStyle = isT ? '#38bdf8' : '#94a3b8'; ctx.font = '9px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(r.name, r.x, r.y+4);
      });

      drawAvatarAndPath(ctx, entrance, avatarPos);
    }

    function drawStair(ctx, x, y, w, h, label) {
      ctx.fillStyle = '#f97316'; ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1; ctx.strokeRect(x, y, w, h);
      ctx.fillStyle = '#ffffff'; ctx.font = '8px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(label, x + w/2, y + h/2 + 3);
    }

    function drawAvatarAndPath(ctx, startPos, avatarPos) {
      if (currentPath.length > 1 && isNavigating) {
        ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 3.5; ctx.setLineDash([4, 4]);
        ctx.beginPath(); ctx.moveTo(currentPath[0].x, currentPath[0].y);
        for (let i = 1; i < currentPath.length; i++) ctx.lineTo(currentPath[i].x, currentPath[i].y);
        ctx.stroke(); ctx.setLineDash([]);
      }
      const pos = avatarPos || startPos;
      ctx.fillStyle = '#38bdf8'; ctx.shadowColor = '#38bdf8'; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.arc(pos.x, pos.y, 7, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5; ctx.stroke(); ctx.shadowBlur = 0;
    }

    /* -------------------------------------------------------------
       خوارزمية التوجيه والملاحة الداخلية
    ------------------------------------------------------------- */
    function startIndoorNavigation() {
      const bKey = document.getElementById('building-select-indoor').value;
      const floor = document.getElementById('floor-select').value;
      const selectedRoom = document.getElementById('room-select').value;
      const canvas = document.getElementById('indoor-canvas');
      const w = canvas.width, h = canvas.height;

      targetRoomGlobal = selectedRoom;

      if (bKey === 'adab' && floor === 'ground' && (selectedRoom === "ق1" || selectedRoom === "ق2")) {
        isCrossFloorJourney = true;
        currentPath = [{ x: w * 0.50, y: h * 0.70 }, { x: w * 0.58, y: h * 0.64 }, { x: w * 0.58, y: h * 0.08 }];
        avatarProgress = 0; isNavigating = true;
        cancelAnimationFrame(animationFrameId); animateCrossFloor();
        return;
      }

      isCrossFloorJourney = false;

      if (bKey === 'uloom') {
        currentPath = [
          { x: w * 0.30, y: h * 0.70 }, { x: w * 0.30, y: h * 0.62 },
          { x: w * 0.54, y: h * 0.62 }, { x: w * 0.54, y: h * 0.48 },
          { x: w * 0.50, y: h * 0.48 }, { x: w * 0.50, y: h * 0.28 },
          { x: w * 0.72, y: h * 0.28 }, { x: w * 0.72, y: h * 0.10 },
          { x: w * 0.35, y: h * 0.10 }
        ];
      } else if (bKey === 'adab') {
        if (floor === 'ground') {
          const ent = { x: w * 0.50, y: h * 0.70 };
          const mainX = w * 0.58;
          const squareLeftX = w * 0.30;
          const squareBottomY = h * 0.54;
          const squareTopY = h * 0.38;

          if (selectedRoom === "مدرج 1") {
            currentPath = [ent, { x: ent.x, y: h * 0.64 }, { x: mainX, y: h * 0.64 }, { x: mainX, y: h * 0.44 }, { x: mainX + 15, y: h * 0.44 }];
          } else if (selectedRoom === "مدرج 2") {
            currentPath = [
              ent, { x: ent.x, y: h * 0.64 }, { x: mainX, y: h * 0.64 },
              { x: mainX, y: squareBottomY }, { x: squareLeftX, y: squareBottomY },
              { x: squareLeftX, y: squareTopY }, { x: squareLeftX - 10, y: squareTopY }
            ];
          }
        } else {
          const stair = { x: w * 0.50, y: h * 0.82 };
          if (selectedRoom === "ق1") currentPath = [stair, { x: stair.x, y: h*0.45 }, { x: w*0.68, y: h*0.45 }, { x: w*0.68, y: h*0.58 }, { x: w*0.70, y: h*0.58 }];
          else currentPath = [stair, { x: stair.x, y: h*0.45 }, { x: w*0.68, y: h*0.45 }, { x: w*0.68, y: h*0.58 }, { x: w*0.88, y: h*0.58 }, { x: w*0.88, y: h*0.28 }];
        }
      } else if (bKey === 'twasaa') {
        const ent = { x: w * 0.50, y: h * 0.65 };
        const bJunc = { x: w * 0.50, y: h * 0.58 };
        const rBtm = { x: w * 0.78, y: h * 0.58 };
        const rTop = { x: w * 0.78, y: h * 0.32 };
        const nJunc = { x: w * 0.50, y: h * 0.32 };

        if (selectedRoom === "مدرج 1") currentPath = [ent, bJunc, rBtm, { x: w*0.78, y: h*0.52 }, { x: w*0.88, y: h*0.52 }];
        else if (selectedRoom === "مدرج 2") currentPath = [ent, bJunc, rBtm, { x: w*0.78, y: h*0.38 }, { x: w*0.88, y: h*0.38 }];
        else if (selectedRoom === "مدرج 3") currentPath = [ent, bJunc, rBtm, rTop, nJunc, { x: w*0.50, y: h*0.24 }, { x: w*0.72, y: h*0.24 }];
        else if (selectedRoom === "مدرج 4") currentPath = [ent, bJunc, rBtm, rTop, nJunc, { x: w*0.50, y: h*0.12 }, { x: w*0.72, y: h*0.12 }];
      } else if (bKey === 'hamak') {
        const ent = { x: w * 0.08, y: h * 0.35 };
        if (selectedRoom === "بي 1") currentPath = [ent, { x: w*0.28, y: h*0.35 }, { x: w*0.68, y: h*0.35 }, { x: w*0.68, y: h*0.20 }, { x: w*0.62, y: h*0.20 }];
        else if (selectedRoom === "بي 2") currentPath = [ent, { x: w*0.28, y: h*0.35 }, { x: w*0.68, y: h*0.35 }, { x: w*0.68, y: h*0.28 }, { x: w*0.62, y: h*0.28 }];
        else if (selectedRoom === "شؤون الطلاب") currentPath = [ent, { x: w*0.28, y: h*0.35 }, { x: w*0.75, y: h*0.35 }, { x: w*0.75, y: h*0.10 }];
        else if (selectedRoom === "مركز الدعم") currentPath = [ent, { x: w*0.28, y: h*0.35 }, { x: w*0.75, y: h*0.35 }, { x: w*0.75, y: h*0.58 }];
        else currentPath = [ent, { x: w*0.40, y: h*0.35 }, { x: w*0.40, y: h*0.28 }];
      }

      avatarProgress = 0; isNavigating = true;
      cancelAnimationFrame(animationFrameId); animate();
    }

    function animateCrossFloor() {
      avatarProgress += 0.004;
      if (avatarProgress >= 1) {
        notify("وصلت لدرج القبو 🪜.. جاري الانتقال لطابق القبو تلقائياً 🎯");
        document.getElementById('floor-select').value = 'basement';
        updateFloorsAndRooms();
        document.getElementById('room-select').value = targetRoomGlobal;

        const canvas = document.getElementById('indoor-canvas');
        const w = canvas.width, h = canvas.height;
        const stair = { x: w * 0.50, y: h * 0.82 };

        if (targetRoomGlobal === "ق1") currentPath = [stair, { x: stair.x, y: h*0.45 }, { x: w*0.68, y: h*0.45 }, { x: w*0.68, y: h*0.58 }, { x: w*0.70, y: h*0.58 }];
        else currentPath = [stair, { x: stair.x, y: h*0.45 }, { x: w*0.68, y: h*0.45 }, { x: w*0.68, y: h*0.58 }, { x: w*0.88, y: h*0.58 }, { x: w*0.88, y: h*0.28 }];

        avatarProgress = 0; animate();
        return;
      }
      drawIndoorCanvas(getPointOnPath(currentPath, avatarProgress));
      animationFrameId = requestAnimationFrame(animateCrossFloor);
    }

    function animate() {
      avatarProgress += 0.004;
      if (avatarProgress >= 1) {
        avatarProgress = 1; isNavigating = false;
        drawIndoorCanvas(getPointOnPath(currentPath, 1));
        notify(`وصلت بنجاح إلى [${document.getElementById('room-select').value}] 🎯`);
        return;
      }
      drawIndoorCanvas(getPointOnPath(currentPath, avatarProgress));
      animationFrameId = requestAnimationFrame(animate);
    }

    function getPointOnPath(path, t) {
      if (path.length < 2) return path[0];
      let total = 0, dists = [];
      for (let i = 0; i < path.length - 1; i++) {
        let d = Math.hypot(path[i + 1].x - path[i].x, path[i + 1].y - path[i].y);
        dists.push(d); total += d;
      }
      let travel = t * total;
      for (let i = 0; i < dists.length; i++) {
        if (travel <= dists[i]) {
          let segT = travel / dists[i];
          return { x: path[i].x + (path[i + 1].x - path[i].x) * segT, y: path[i].y + (path[i + 1].y - path[i].y) * segT };
        }
        travel -= dists[i];
      }
      return path[path.length - 1];
    }

    window.onload = function() { initOutdoorMap(); };
  </script>
