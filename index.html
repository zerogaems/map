<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>كلية الآداب - الأرضي والقبو</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #0f172a; color: #ffffff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    
    .map-container { flex: 1; width: 100%; height: 100%; position: relative; }
    #indoor-canvas { width: 100%; height: 100%; display: block; }

    .controls-panel {
      position: absolute; bottom: 12px; left: 12px; right: 12px;
      background-color: #1e293b; padding: 12px; border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5); border: 1px solid #334155;
      display: flex; flex-direction: column; gap: 8px; z-index: 1000;
    }

    .dropdown-group { display: flex; gap: 6px; }
    select, button {
      padding: 10px; border-radius: 8px; border: 1px solid #475569;
      font-size: 13px; background-color: #0f172a; color: #f8fafc; flex: 1;
    }

    button.action-btn { background-color: #2481cc; color: #fff; font-weight: bold; border: none; cursor: pointer; }
    button.secondary-btn { background-color: #334155; border: 1px solid #475569; }
  </style>
</head>
<body>

  <div class="map-container">
    <canvas id="indoor-canvas"></canvas>
    
    <div class="controls-panel">
      <div class="dropdown-group">
        <select id="floor-select" onchange="onFloorChange()">
          <option value="ground">الطابق الأرضي</option>
          <option value="basement">طابق القبو</option>
        </select>

        <select id="room-select" onchange="resetAnimation()">
          <option value="مدرج 1">مدرج 1</option>
          <option value="مدرج 2">مدرج 2</option>
          <option value="ق1">قاعة ق1</option>
          <option value="ق2">قاعة ق2</option>
        </select>
      </div>

      <div class="btn-row" style="display: flex; gap: 6px;">
        <button class="action-btn" onclick="startNavigation()">انطلق نحو الوجهة 🚶‍♂️</button>
        <button class="action-btn secondary-btn" style="flex: 0.35;" onclick="resetAnimation()">🔄 إعادة</button>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready(); tg.expand();

    let animationFrameId, avatarProgress = 0, isNavigating = false, currentPath = [];
    let isCrossFloorJourney = false;
    let targetRoomGlobal = "";

    function resetAnimation() {
      cancelAnimationFrame(animationFrameId);
      avatarProgress = 0;
      isNavigating = false;
      isCrossFloorJourney = false;
      drawCanvas();
    }

    function onFloorChange() {
      resetAnimation();
    }

    function drawCanvas(avatarPos = null) {
      const canvas = document.getElementById('indoor-canvas');
      const ctx = canvas.getContext('2d');
      const floor = document.getElementById('floor-select').value;
      const selectedRoom = document.getElementById('room-select').value;

      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
      const w = canvas.width, h = canvas.height;

      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, w, h);

      if (floor === 'ground') {
        drawGroundFloor(ctx, w, h, selectedRoom, avatarPos);
      } else {
        drawBasementFloor(ctx, w, h, selectedRoom, avatarPos);
      }

      // العنوان العلوي
      ctx.fillStyle = '#f8fafc'; ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(`كلية الآداب - ${floor === 'ground' ? 'الطابق الأرضي' : 'طابق القبو'}`, w / 2, 28);
    }

    // --- رسم الطابق الأرضي ---
    function drawGroundFloor(ctx, w, h, selectedRoom, avatarPos) {
      const entrance = { x: w * 0.50, y: h * 0.68 };
      const stubY = h * 0.64;
      const mainCorridorX = w * 0.58;
      const squareLeftX = w * 0.32;
      const squareBottomY = h * 0.52;
      const squareTopY = h * 0.38;

      ctx.strokeStyle = '#334155'; ctx.lineCap = 'round'; ctx.lineJoin = 'round';

      // ممر الدخول والتقاطع المقطوع
      ctx.lineWidth = w * 0.05;
      ctx.beginPath(); ctx.moveTo(entrance.x, entrance.y); ctx.lineTo(entrance.x, stubY); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(w * 0.38, stubY); ctx.lineTo(w * 0.62, stubY); ctx.stroke();
      ctx.strokeStyle = '#f43f5e'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(w * 0.38, stubY - 6); ctx.lineTo(w * 0.38, stubY + 6); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(w * 0.62, stubY - 6); ctx.lineTo(w * 0.62, stubY + 6); ctx.stroke();

      // الممر الصاعد والأدراج
      ctx.strokeStyle = '#334155'; ctx.lineWidth = w * 0.05;
      ctx.beginPath(); ctx.moveTo(entrance.x, stubY); ctx.lineTo(mainCorridorX, stubY); ctx.lineTo(mainCorridorX, h * 0.30); ctx.stroke();
      drawStair(ctx, mainCorridorX - 10, h * 0.57, 20, 10, '3 درجات');

      // المربع المركزي والحمامات
      ctx.beginPath();
      ctx.moveTo(mainCorridorX, squareBottomY); ctx.lineTo(squareLeftX, squareBottomY);
      ctx.lineTo(squareLeftX, squareTopY); ctx.lineTo(mainCorridorX, squareTopY);
      ctx.stroke();

      ctx.fillStyle = '#0284c7'; ctx.fillRect(squareLeftX + 10, squareBottomY - 18, 30, 15);
      ctx.fillStyle = '#ffffff'; ctx.font = '8px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('🚹', squareLeftX + 25, squareBottomY - 7);
      ctx.fillStyle = '#ec4899'; ctx.fillRect(squareLeftX + 45, squareBottomY - 18, 30, 15);
      ctx.fillStyle = '#ffffff'; ctx.fillText('🚺', squareLeftX + 60, squareBottomY - 7);

      drawStair(ctx, squareLeftX - 18, squareTopY + 20, 14, 20, 'درج');

      // مكاتب
      ctx.fillStyle = '#1e293b'; ctx.strokeStyle = '#64748b'; ctx.lineWidth = 1;
      ctx.fillRect(squareLeftX + 20, squareTopY - 25, 60, 20); ctx.strokeRect(squareLeftX + 20, squareTopY - 25, 60, 20);
      ctx.fillStyle = '#94a3b8'; ctx.font = '9px sans-serif'; ctx.fillText('مكاتب 🏢', squareLeftX + 50, squareTopY - 12);

      // مدرج 1 و 2
      let isH1 = (selectedRoom === "مدرج 1");
      ctx.fillStyle = isH1 ? '#1e3a8a' : '#1e293b'; ctx.strokeStyle = isH1 ? '#38bdf8' : '#475569'; ctx.lineWidth = isH1 ? 2 : 1;
      ctx.fillRect(mainCorridorX + 12, h * 0.44, 45, 25); ctx.strokeRect(mainCorridorX + 12, h * 0.44, 45, 25);
      ctx.fillStyle = isH1 ? '#38bdf8' : '#94a3b8'; ctx.font = isH1 ? 'bold 11px sans-serif' : '10px sans-serif';
      ctx.fillText('مدرج 1 🎯', mainCorridorX + 34, h * 0.45 + 14);

      let isH2 = (selectedRoom === "مدرج 2");
      ctx.fillStyle = isH2 ? '#1e3a8a' : '#1e293b'; ctx.strokeStyle = isH2 ? '#38bdf8' : '#475569'; ctx.lineWidth = isH2 ? 2 : 1;
      ctx.fillRect(squareLeftX - 55, squareTopY - 5, 45, 25); ctx.strokeRect(squareLeftX - 55, squareTopY - 5, 45, 25);
      ctx.fillStyle = isH2 ? '#38bdf8' : '#94a3b8'; ctx.font = isH2 ? 'bold 11px sans-serif' : '10px sans-serif';
      ctx.fillText('مدرج 2 🎯', squareLeftX - 33, squareTopY + 11);

      // امتداد القبو العلوي
      ctx.strokeStyle = '#334155'; ctx.lineWidth = w * 0.04;
      ctx.beginPath(); ctx.moveTo(mainCorridorX, squareTopY); ctx.lineTo(mainCorridorX, h * 0.07 + 20); ctx.stroke();

      ctx.fillStyle = '#1e293b'; ctx.strokeStyle = '#64748b'; ctx.lineWidth = 1;
      ctx.fillRect(mainCorridorX + 12, h * 0.22, 45, 18); ctx.strokeRect(mainCorridorX + 12, h * 0.22, 45, 18);
      ctx.fillStyle = '#94a3b8'; ctx.font = '8px sans-serif'; ctx.fillText('تصوير 🖨️', mainCorridorX + 34, h * 0.22 + 12);

      drawStair(ctx, mainCorridorX - 8, h * 0.20, 16, 8, 'نزلة');

      ctx.fillStyle = '#1e293b'; ctx.strokeStyle = '#64748b';
      ctx.fillRect(mainCorridorX - 45, h * 0.14, 40, 18); ctx.strokeRect(mainCorridorX - 45, h * 0.14, 40, 18);
      ctx.fillStyle = '#94a3b8'; ctx.font = '8px sans-serif'; ctx.fillText('كافيه ☕', mainCorridorX - 25, h * 0.14 + 12);

      // غرفة درج القبو
      ctx.fillStyle = '#581c87'; ctx.strokeStyle = '#a855f7'; ctx.lineWidth = 2;
      ctx.fillRect(mainCorridorX - 25, h * 0.07 - 15, 50, 30); ctx.strokeRect(mainCorridorX - 25, h * 0.07 - 15, 50, 30);
      ctx.fillStyle = '#c084fc'; ctx.font = 'bold 11px sans-serif';
      ctx.fillText('درج القبو 🪜', mainCorridorX, h * 0.07 + 3);

      // المدخل
      ctx.fillStyle = '#22c55e'; ctx.beginPath(); ctx.arc(entrance.x, entrance.y, 8, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.font = 'bold 11px sans-serif'; ctx.fillText('المدخل 🚪', entrance.x, entrance.y + 18);

      drawAvatarAndPath(ctx, entrance, avatarPos);
    }

    // --- رسم طابق القبو (مطابق للرسمة الجديدة بدقة) ---
    function drawBasementFloor(ctx, w, h, selectedRoom, avatarPos) {
      const stairPos = { x: w * 0.50, y: h * 0.85 };
      const vertCorridorX = w * 0.50;
      const gardenSquare = { x: w * 0.55, y: h * 0.20, w: w * 0.35, h: h * 0.30 };

      ctx.strokeStyle = '#334155'; ctx.lineCap = 'round'; ctx.lineJoin = 'round';

      // 1. مربع الدرج في الأسفل مع الأبواب المقطوعة يمين ويسار
      ctx.lineWidth = w * 0.06;
      ctx.beginPath(); ctx.moveTo(stairPos.x, stairPos.y + 25); ctx.lineTo(stairPos.x, h * 0.65); ctx.stroke();

      // الأبواب المقطوعة (يمين ويسار)
      ctx.beginPath(); ctx.moveTo(w * 0.35, h * 0.75); ctx.lineTo(w * 0.65, h * 0.75); ctx.stroke();
      ctx.strokeStyle = '#f43f5e'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(w * 0.35, h * 0.72); ctx.lineTo(w * 0.35, h * 0.78); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(w * 0.65, h * 0.72); ctx.lineTo(w * 0.65, h * 0.78); ctx.stroke();

      // 2. الممر الطويل صعوداً والمكاتب
      ctx.strokeStyle = '#334155'; ctx.lineWidth = w * 0.06;
      ctx.beginPath(); ctx.moveTo(vertCorridorX, h * 0.65); ctx.lineTo(vertCorridorX, h * 0.35); ctx.stroke();

      // مكتب على اليسار
      ctx.fillStyle = '#1e293b'; ctx.strokeStyle = '#64748b'; ctx.lineWidth = 1;
      ctx.fillRect(vertCorridorX - 45, h * 0.50, 40, 18); ctx.strokeRect(vertCorridorX - 45, h * 0.50, 40, 18);
      ctx.fillStyle = '#94a3b8'; ctx.font = '8px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('مكتب 🏢', vertCorridorX - 25, h * 0.50 + 12);

      // الانعطاف يميناً نحو القاعات
      ctx.beginPath(); ctx.moveTo(vertCorridorX, h * 0.35); ctx.lineTo(gardenSquare.x, h * 0.35); ctx.stroke();

      // مكتب ثاني على الممر الجانبي
      ctx.fillRect(w * 0.60, h * 0.30, 35, 16); ctx.strokeRect(w * 0.60, h * 0.30, 35, 16);
      ctx.fillText('مكتب 🏢', w * 0.77, h * 0.30 + 11);

      // 3. المستطيل الكبير مع الحديقة والـ ق1 و ق2
      ctx.strokeStyle = '#334155'; ctx.lineWidth = w * 0.06;
      ctx.beginPath();
      ctx.moveTo(gardenSquare.x, h * 0.55);
      ctx.lineTo(gardenSquare.x + gardenSquare.w, h * 0.55);
      ctx.lineTo(gardenSquare.x + gardenSquare.w, gardenSquare.y);
      ctx.lineTo(gardenSquare.x, gardenSquare.y);
      ctx.lineTo(gardenSquare.x, h * 0.55);
      ctx.stroke();

      // الحديقة الداخلية
      const innerGarden = { x: gardenSquare.x + w * 0.06, y: gardenSquare.y + h * 0.06, w: w * 0.23, h: h * 0.18 };
      ctx.fillStyle = '#14532d'; ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 1.5;
      ctx.fillRect(innerGarden.x, innerGarden.y, innerGarden.w, innerGarden.h);
      ctx.strokeRect(innerGarden.x, innerGarden.y, innerGarden.w, innerGarden.h);
      ctx.fillStyle = '#86efac'; ctx.font = '9px sans-serif'; ctx.fillText('حديقة 🌿', innerGarden.x + innerGarden.w/2, innerGarden.y + innerGarden.h/2 + 3);

      // قاعة ق1 (أسفل المربع)
      let isQ1 = (selectedRoom === "ق1");
      ctx.fillStyle = isQ1 ? '#1e3a8a' : '#1e293b'; ctx.strokeStyle = isQ1 ? '#38bdf8' : '#475569'; ctx.lineWidth = isQ1 ? 2 : 1;
      ctx.fillRect(gardenSquare.x + gardenSquare.w/2 - 25, h * 0.52, 50, 22);
      ctx.strokeRect(gardenSquare.x + gardenSquare.w/2 - 25, h * 0.52, 50, 22);
      ctx.fillStyle = isQ1 ? '#38bdf8' : '#94a3b8'; ctx.font = isQ1 ? 'bold 11px sans-serif' : '10px sans-serif';
      ctx.fillText('قاعة ق1 🎯', gardenSquare.x + gardenSquare.w/2, h * 0.52 + 14);

      // مكتب بوشنا / وسطي
      ctx.fillStyle = '#1e293b'; ctx.strokeStyle = '#64748b'; ctx.lineWidth = 1;
      ctx.fillRect(gardenSquare.x + gardenSquare.w - 18, h * 0.38, 16, 35);
      ctx.strokeRect(gardenSquare.x + gardenSquare.w - 18, h * 0.38, 16, 35);

      // قاعة ق2 (على اليمين/اليسار حسب الرسمة - الجانب الأيمن من المربع)
      let isQ2 = (selectedRoom === "ق2");
      ctx.fillStyle = isQ2 ? '#1e3a8a' : '#1e293b'; ctx.strokeStyle = isQ2 ? '#38bdf8' : '#475569'; ctx.lineWidth = isQ2 ? 2 : 1;
      ctx.fillRect(gardenSquare.x + gardenSquare.w - 6, h * 0.22, 22, 45);
      ctx.strokeRect(gardenSquare.x + gardenSquare.w - 6, h * 0.22, 22, 45);
      ctx.fillStyle = isQ2 ? '#38bdf8' : '#94a3b8'; ctx.font = isQ2 ? 'bold 10px sans-serif' : '9px sans-serif';
      ctx.fillText('ق2', gardenSquare.x + gardenSquare.w + 5, h * 0.22 + 25);

      // نقطة الدرج في القبو
      ctx.fillStyle = '#a855f7'; ctx.beginPath(); ctx.arc(stairPos.x, stairPos.y, 8, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.font = 'bold 10px sans-serif'; ctx.fillText('بيت الدرج 🪜', stairPos.x, stairPos.y + 20);

      drawAvatarAndPath(ctx, stairPos, avatarPos);
    }

    function drawAvatarAndPath(ctx, startPos, avatarPos) {
      if (currentPath.length > 1 && isNavigating) {
        ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 4; ctx.setLineDash([5, 5]);
        ctx.beginPath(); ctx.moveTo(currentPath[0].x, currentPath[0].y);
        for (let i = 1; i < currentPath.length; i++) ctx.lineTo(currentPath[i].x, currentPath[i].y);
        ctx.stroke(); ctx.setLineDash([]);
      }
      const pos = avatarPos || startPos;
      ctx.fillStyle = '#38bdf8'; ctx.shadowColor = '#38bdf8'; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.arc(pos.x, pos.y, 8, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke(); ctx.shadowBlur = 0;
    }

    function drawStair(ctx, x, y, w, h, label) {
      ctx.fillStyle = '#f97316'; ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1; ctx.strokeRect(x, y, w, h);
      ctx.fillStyle = '#ffffff'; ctx.font = '8px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(label, x + w/2, y + h/2 + 3);
    }

    // --- منطق الملاحة والربط السحري بين الطابقين ---
    function startNavigation() {
      const floor = document.getElementById('floor-select').value;
      const selectedRoom = document.getElementById('room-select').value;
      targetRoomGlobal = selectedRoom;

      // إذا اختار ق1 أو ق2 وهو في الأرضي -> نفذ الربط العابر للطوابق
      if (floor === 'ground' && (selectedRoom === "ق1" || selectedRoom === "ق2")) {
        isCrossFloorJourney = true;
        runGroundToBasementNavigation();
        return;
      }

      isCrossFloorJourney = false;
      runSingleFloorNavigation(floor, selectedRoom);
    }

    function runSingleFloorNavigation(floor, selectedRoom) {
      const canvas = document.getElementById('indoor-canvas');
      const w = canvas.width, h = canvas.height;

      if (floor === 'ground') {
        const entrance = { x: w * 0.50, y: h * 0.68 };
        const mainCorridorX = w * 0.58;
        const squareLeftX = w * 0.32;
        const squareTopY = h * 0.38;

        if (selectedRoom === "مدرج 1") {
          currentPath = [entrance, { x: entrance.x, y: h * 0.64 }, { x: mainCorridorX, y: h * 0.64 }, { x: mainCorridorX, y: h * 0.45 }, { x: mainCorridorX + 12, y: h * 0.45 }];
        } else if (selectedRoom === "مدرج 2") {
          currentPath = [entrance, { x: entrance.x, y: h * 0.64 }, { x: mainCorridorX, y: h * 0.64 }, { x: mainCorridorX, y: h * 0.52 }, { x: squareLeftX, y: h * 0.52 }, { x: squareLeftX, y: squareTopY }, { x: squareLeftX - 10, y: squareTopY }];
        } else {
          currentPath = [entrance, { x: entrance.x, y: h * 0.64 }, { x: mainCorridorX, y: h * 0.64 }, { x: mainCorridorX, y: h * 0.07 }];
        }
      } else {
        const stairPos = { x: w * 0.50, y: h * 0.85 };
        const gardenSquareX = w * 0.55;

        if (selectedRoom === "ق1") {
          currentPath = [stairPos, { x: stairPos.x, y: h * 0.35 }, { x: gardenSquareX, y: h * 0.35 }, { x: gardenSquareX + (w*0.35)/2, y: h * 0.52 }];
        } else {
          currentPath = [stairPos, { x: stairPos.x, y: h * 0.35 }, { x: gardenSquareX, y: h * 0.35 }, { x: gardenSquareX + w*0.35, y: h * 0.35 }, { x: gardenSquareX + w*0.35, y: h * 0.22 }];
        }
      }

      avatarProgress = 0; isNavigating = true;
      cancelAnimationFrame(animationFrameId); animate();
    }

    function runGroundToBasementNavigation() {
      const canvas = document.getElementById('indoor-canvas');
      const w = canvas.width, h = canvas.height;

      // المرحلة الأولى: من المدخل إلى درج القبو في الأرضي
      const entrance = { x: w * 0.50, y: h * 0.68 };
      const mainCorridorX = w * 0.58;

      currentPath = [entrance, { x: entrance.x, y: h * 0.64 }, { x: mainCorridorX, y: h * 0.64 }, { x: mainCorridorX, y: h * 0.07 }];

      avatarProgress = 0; isNavigating = true;
      cancelAnimationFrame(animationFrameId); animateCrossFloorPhase1();
    }

    function animateCrossFloorPhase1() {
      avatarProgress += 0.004;
      if (avatarProgress >= 1) {
        // وصل للدرج في الأرضي -> الانتقال السحري للقبو
        if (tg && tg.showAlert) tg.showAlert("وصلت لدرج القبو 🪜.. جاري الانتقال لطابق القبو للوصول إلى قاعة الأهداف 🎯");
        
        document.getElementById('floor-select').value = 'basement';
        document.getElementById('room-select').value = targetRoomGlobal;

        // المرحلة الثانية: من بيت الدرج للقاعة المطلوبة في القبو
        const canvas = document.getElementById('indoor-canvas');
        const w = canvas.width, h = canvas.height;
        const stairPos = { x: w * 0.50, y: h * 0.85 };
        const gardenSquareX = w * 0.55;

        if (targetRoomGlobal === "ق1") {
          currentPath = [stairPos, { x: stairPos.x, y: h * 0.35 }, { x: gardenSquareX, y: h * 0.35 }, { x: gardenSquareX + (w*0.35)/2, y: h * 0.52 }];
        } else {
          currentPath = [stairPos, { x: stairPos.x, y: h * 0.35 }, { x: gardenSquareX, y: h * 0.35 }, { x: gardenSquareX + w*0.35, y: h * 0.35 }, { x: gardenSquareX + w*0.35, y: h * 0.22 }];
        }

        avatarProgress = 0;
        animateCrossFloorPhase2();
        return;
      }
      drawCanvas(getPointOnPath(currentPath, avatarProgress));
      animationFrameId = requestAnimationFrame(animateCrossFloorPhase1);
    }

    function animateCrossFloorPhase2() {
      avatarProgress += 0.004;
      if (avatarProgress >= 1) {
        avatarProgress = 1; isNavigating = false;
        drawCanvas(getPointOnPath(currentPath, 1));
        if (tg && tg.showAlert) tg.showAlert(`وصلت بنجاح إلى [${targetRoomGlobal}] في القبو 🎯`);
        return;
      }
      drawCanvas(getPointOnPath(currentPath, avatarProgress));
      animationFrameId = requestAnimationFrame(animateCrossFloorPhase2);
    }

    function animate() {
      avatarProgress += 0.004;
      if (avatarProgress >= 1) {
        avatarProgress = 1; isNavigating = false;
        drawCanvas(getPointOnPath(currentPath, 1));
        if (tg && tg.showAlert) tg.showAlert(`وصلت بنجاح إلى [${document.getElementById('room-select').value}] 🎯`);
        return;
      }
      drawCanvas(getPointOnPath(currentPath, avatarProgress));
      animationFrameId = requestAnimationFrame(animate);
    }

    function getPointOnPath(path, t) {
      if (path.length < 2) return path[0];
      let total = 0, dists = [];
      for (let i = 0; i < path.length - 1; i++) {
        let d = Math.hypot(path[i + 1].x - path[i].x, path[i + 1].y - path[i].y);
        dists.push(d); total += d;
      }
      let travel = t * total;
      for (let i = 0; i < dists.length; i++) {
        if (travel <= dists[i]) {
          let segT = travel / dists[i];
          return { x: path[i].x + (path[i + 1].x - path[i].x) * segT, y: path[i].y + (path[i + 1].y - path[i].y) * segT };
        }
        travel -= dists[i];
      }
      return path[path.length - 1];
    }

    window.onload = drawCanvas;
  </script>
</body>
</html>
