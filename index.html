<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>دليل الكليات والقاعات</title>

  <!-- 1. مكتبة تلغرام -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- 2. مكتبة Leaflet للخرائط -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #ffffff);
      --text-color: var(--tg-theme-text-color, #222222);
      --button-color: var(--tg-theme-button-color, #2481cc);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
      --secondary-bg: var(--tg-theme-secondary-bg-color, #f4f4f5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .top-nav {
      display: flex;
      background-color: var(--secondary-bg);
      padding: 8px;
      gap: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      z-index: 1000;
    }

    .nav-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background-color: transparent;
      color: var(--text-color);
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .nav-btn.active {
      background-color: var(--button-color);
      color: var(--button-text);
    }

    .map-container {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
    }

    #outdoor-map {
      width: 100%;
      height: 100%;
    }

    #indoor-container {
      background-color: #0f172a;
    }

    .controls-panel {
      position: absolute;
      bottom: 15px;
      left: 15px;
      right: 15px;
      background-color: var(--bg-color);
      padding: 12px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .dropdown-group {
      display: flex;
      gap: 8px;
    }

    select, button.action-btn {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 13px;
      background-color: var(--secondary-bg);
      color: var(--text-color);
    }

    select { flex: 1; }

    button.action-btn {
      background-color: var(--button-color);
      color: var(--button-text);
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    #indoor-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>

  <!-- شريط التنقل العلوي -->
  <div class="top-nav">
    <button id="btn-outdoor" class="nav-btn active" onclick="switchView('outdoor')">الخارجية (الجامعة)</button>
    <button id="btn-indoor" class="nav-btn" onclick="switchView('indoor')">الداخلية (الكلية)</button>
  </div>

  <!-- الخريطة الخارجية -->
  <div id="outdoor-container" class="map-container">
    <div id="outdoor-map"></div>
    <div class="controls-panel">
      <div class="dropdown-group">
        <select id="building-select-outdoor" onchange="focusBuildingOnMap(this.value)">
          <option value="main">🚪 المدخل الرئيسي للجامعة</option>
          <option value="hamak">1. كلية الهمك</option>
          <option value="twasaa">2. مبنى التوسع</option>
          <option value="adab">3. كلية الآداب</option>
          <option value="uloom">4. كلية العلوم</option>
        </select>
      </div>
      <button class="action-btn" id="btn-locate" onclick="locateUser()">📍 حدد موقعي وارسم المسار</button>
    </div>
  </div>

  <!-- المخطط الداخلي والتنقل بين المباني والقاعات -->
  <div id="indoor-container" class="map-container" style="display: none;">
    <canvas id="indoor-canvas"></canvas>
    
    <div class="controls-panel">
      <div class="dropdown-group">
        <select id="building-select-indoor" onchange="syncAndChangeBuilding(this.value)">
          <option value="hamak">1. كلية الهمك</option>
          <option value="twasaa">2. مبنى التوسع</option>
          <option value="adab">3. كلية الآداب</option>
          <option value="uloom">4. كلية العلوم</option>
        </select>

        <select id="room-select" onchange="resetIndoorAnimation()">
        </select>
      </div>

      <button class="action-btn" onclick="startIndoorNavigation()">انطلق نحو القاعة 🚶‍♂️</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    function notify(message) {
      if (tg && tg.showAlert) {
        tg.showAlert(message);
      } else {
        alert(message);
      }
    }

    let map;
    let userMarker;
    let buildingMarkers = {};
    let routeLine;
    let isIndoorActive = false;

    // إحداثيات المستطيل
    const southWest = L.latLng(35.51958875818877, 35.80444387688746);
    const northEast = L.latLng(35.52780824158785, 35.81065192458042);
    const campusBounds = L.latLngBounds(southWest, northEast);

    const campusData = {
      main: { name: "المدخل الرئيسي للجامعة", lat: 35.52601940733772, lng: 35.806881711117235 },
      hamak: { name: "كلية الهمك", lat: 35.524735104049554, lng: 35.80832173303512, rooms: ["21م", "22م", "23م", "21ك", "22ك", "23ك", "44ك"] },
      twasaa: { name: "مبنى التوسع", lat: 35.52309984997797, lng: 35.809953816186045, rooms: ["مدرج 1", "مدرج 2", "مدرج 3", "مدرج 4"] },
      adab: { name: "كلية الآداب", lat: 35.52142722934893, lng: 35.808531572615784, rooms: ["مدرج 1", "مدرج 2", "ق1", "ق2"] },
      uloom: { name: "كلية العلوم", lat: 35.523082390509956, lng: 35.805570862320266, rooms: ["مدرج 1", "مدرج 2", "مدرج 3", "مدرج 4"] }
    };

    /* -------------------------------------------------------------
       1. الخريطة الخارجية (LEAFLET MAP)
    ------------------------------------------------------------- */
    function initOutdoorMap() {
      map = L.map('outdoor-map', {
        maxBounds: campusBounds,
        maxBoundsViscosity: 0.5,
        minZoom: 16,
        maxZoom: 19
      }).setView([campusData.main.lat, campusData.main.lng], 17);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      }).addTo(map);

      Object.keys(campusData).forEach(key => {
        const item = campusData[key];
        const marker = L.marker([item.lat, item.lng]).addTo(map)
          .bindPopup(`<b>${item.name}</b>`);
        buildingMarkers[key] = marker;
      });

      buildingMarkers['main'].openPopup();
    }

    function locateUser() {
      const btn = document.getElementById('btn-locate');
      btn.innerText = "⏳ جاري تحديد الموقع...";

      if (!navigator.geolocation) {
        notify("خدمة الـ GPS غير مدعومة في متصفحك.");
        btn.innerText = "📍 حدد موقعي وارسم المسار";
        return;
      }

      const geoOptions = {
        timeout: 15000,
        maximumAge: 60000,
        enableHighAccuracy: false
      };

      navigator.geolocation.getCurrentPosition(
        position => {
          btn.innerText = "📍 حدد موقعي وارسم المسار";
          const userLat = position.coords.latitude;
          const userLng = position.coords.longitude;
          const userLatLng = L.latLng(userLat, userLng);

          if (!campusBounds.contains(userLatLng)) {
            notify("أنت حالياً خارج نطاق الحرم الجامعي! يمكنك استكشاف الخريطة والتنقل بين الكليات يدوياً.");
            return;
          }

          if (userMarker) map.removeLayer(userMarker);
          userMarker = L.marker([userLat, userLng]).addTo(map)
            .bindPopup('موقعك الحالي 📍').openPopup();

          const selectedBuildingKey = document.getElementById('building-select-outdoor').value;
          
          if (selectedBuildingKey && campusData[selectedBuildingKey]) {
            const target = campusData[selectedBuildingKey];
            drawRouteLine([userLat, userLng], [target.lat, target.lng]);

            const fitBounds = L.latLngBounds([[userLat, userLng], [target.lat, target.lng]]);
            map.fitBounds(fitBounds, { padding: [40, 40] });
          } else {
            map.setView([userLat, userLng], 18);
          }
        },
        error => {
          btn.innerText = "📍 حدد موقعي وارسم المسار";
          let errorMsg = "تعذر تحديد الموقع.";
          if (error.code === 1) errorMsg = "يرجى منح صلاحية الموقع للتطبيق في إعدادات الهاتف.";
          else if (error.code === 2) errorMsg = "إشارة الـ GPS ضعيفة حالياً، يرجى المحاولة في مكان مكشوف.";
          else if (error.code === 3) errorMsg = "استغرق تحديد الموقع وقتاً طويلاً، حاول مرة أخرى.";
          notify(errorMsg);
        },
        geoOptions
      );
    }

    function focusBuildingOnMap(key) {
      if (campusData[key]) {
        const target = campusData[key];

        if (userMarker) {
          const userLatLng = userMarker.getLatLng();
          drawRouteLine([userLatLng.lat, userLatLng.lng], [target.lat, target.lng]);

          const bounds = L.latLngBounds([[userLatLng.lat, userLatLng.lng], [target.lat, target.lng]]);
          map.fitBounds(bounds, { padding: [40, 40] });
        } else {
          map.flyTo([target.lat, target.lng], 18, { animate: true, duration: 0.8 });
        }

        buildingMarkers[key].openPopup();
      }
    }

    function drawRouteLine(fromLatLng, toLatLng) {
      if (routeLine) map.removeLayer(routeLine);

      routeLine = L.polyline([fromLatLng, toLatLng], {
        color: '#2481cc',
        weight: 4,
        dashArray: '8, 8',
        opacity: 0.8
      }).addTo(map);
    }

    function syncAndChangeBuilding(key) {
      document.getElementById('building-select-outdoor').value = key;
      focusBuildingOnMap(key);
      updateRooms();
    }

    function updateRooms() {
      const buildingSelect = document.getElementById('building-select-indoor');
      const roomSelect = document.getElementById('room-select');
      const selectedBuilding = buildingSelect.value;

      roomSelect.innerHTML = '';

      if (campusData[selectedBuilding] && campusData[selectedBuilding].rooms) {
        const rooms = campusData[selectedBuilding].rooms;
        rooms.forEach(room => {
          const option = document.createElement('option');
          option.value = room;
          option.textContent = room;
          roomSelect.appendChild(option);
        });
      }

      resetIndoorAnimation();
    }

    function switchView(view) {
      const outdoorContainer = document.getElementById('outdoor-container');
      const indoorContainer = document.getElementById('indoor-container');
      const btnOutdoor = document.getElementById('btn-outdoor');
      const btnIndoor = document.getElementById('btn-indoor');

      if (view === 'outdoor') {
        isIndoorActive = false;
        cancelAnimationFrame(animationFrameId);
        outdoorContainer.style.display = 'block';
        indoorContainer.style.display = 'none';
        btnOutdoor.classList.add('active');
        btnIndoor.classList.remove('active');
        setTimeout(() => map.invalidateSize(), 150);
      } else {
        isIndoorActive = true;
        outdoorContainer.style.display = 'none';
        indoorContainer.style.display = 'block';
        btnIndoor.classList.add('active');
        btnOutdoor.classList.remove('active');
        updateRooms();
      }
    }

    /* -------------------------------------------------------------
       2. المخطط الداخلي وتنقّل الشخصية (INDOOR CANVAS & AVATAR)
    ------------------------------------------------------------- */
    let animationFrameId;
    let avatarProgress = 0;
    let isNavigating = false;
    let currentPath = [];

    // شبكة نسبية لتوزيع القاعات والممرات على أي حجم شاشة
    function getBuildingLayout(buildingKey, w, h) {
      const centerX = w * 0.5;
      const corridorY = h * 0.45;
      const entranceY = h * 0.80;

      // مدخل الكلية
      const entranceNode = { x: centerX, y: entranceY };
      const mainIntersectionNode = { x: centerX, y: corridorY };

      let roomsLayout = [];

      if (buildingKey === 'hamak') {
        roomsLayout = [
          { name: "21م", x: w * 0.20, y: h * 0.25, sideNode: { x: w * 0.20, y: corridorY } },
          { name: "22م", x: w * 0.38, y: h * 0.25, sideNode: { x: w * 0.38, y: corridorY } },
          { name: "23م", x: w * 0.56, y: h * 0.25, sideNode: { x: w * 0.56, y: corridorY } },
          { name: "21ك", x: w * 0.20, y: h * 0.65, sideNode: { x: w * 0.20, y: corridorY } },
          { name: "22ك", x: w * 0.38, y: h * 0.65, sideNode: { x: w * 0.38, y: corridorY } },
          { name: "23ك", x: w * 0.56, y: h * 0.65, sideNode: { x: w * 0.56, y: corridorY } },
          { name: "44ك", x: w * 0.78, y: h * 0.25, sideNode: { x: w * 0.78, y: corridorY } }
        ];
      } else {
        // مخطط زمني لباقي الكليات (التوسع، الآداب، العلوم)
        roomsLayout = [
          { name: "مدرج 1", x: w * 0.22, y: h * 0.25, sideNode: { x: w * 0.22, y: corridorY } },
          { name: "مدرج 2", x: w * 0.78, y: h * 0.25, sideNode: { x: w * 0.78, y: corridorY } },
          { name: "مدرج 3", x: w * 0.22, y: h * 0.65, sideNode: { x: w * 0.22, y: corridorY } },
          { name: "مدرج 4", x: w * 0.78, y: h * 0.65, sideNode: { x: w * 0.78, y: corridorY } },
          { name: "ق1", x: w * 0.22, y: h * 0.25, sideNode: { x: w * 0.22, y: corridorY } },
          { name: "ق2", x: w * 0.78, y: h * 0.25, sideNode: { x: w * 0.78, y: corridorY } }
        ];
      }

      return { entranceNode, mainIntersectionNode, corridorY, roomsLayout };
    }

    function resetIndoorAnimation() {
      cancelAnimationFrame(animationFrameId);
      avatarProgress = 0;
      isNavigating = false;
      drawIndoorCanvas();
    }

    function drawIndoorCanvas(avatarPos = null) {
      const canvas = document.getElementById('indoor-canvas');
      const ctx = canvas.getContext('2d');
      const buildingKey = document.getElementById('building-select-indoor').value;
      const selectedRoom = document.getElementById('room-select').value;
      const buildingName = campusData[buildingKey].name;

      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;

      const w = canvas.width;
      const h = canvas.height;

      // 1. خلفية المخطط المعماري
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, w, h);

      const layout = getBuildingLayout(buildingKey, w, h);

      // 2. رسم الممر الرئيسي (Corridor)
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = w * 0.08;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      ctx.beginPath();
      ctx.moveTo(layout.entranceNode.x, layout.entranceNode.y);
      ctx.lineTo(layout.mainIntersectionNode.x, layout.mainIntersectionNode.y);
      ctx.moveTo(w * 0.12, layout.corridorY);
      ctx.lineTo(w * 0.88, layout.corridorY);
      ctx.stroke();

      // خط مركز الممر
      ctx.strokeStyle = '#475569';
      ctx.lineWidth = 2;
      ctx.stroke();

      // 3. رسم مدخل الكلية
      ctx.fillStyle = '#22c55e';
      ctx.beginPath();
      ctx.arc(layout.entranceNode.x, layout.entranceNode.y, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 12px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('المدخل الرئيسي 🚪', layout.entranceNode.x, layout.entranceNode.y + 25);

      // 4. رسم القاعات
      const currentRooms = campusData[buildingKey].rooms;
      layout.roomsLayout.forEach(room => {
        if (!currentRooms.includes(room.name)) return;

        const isTarget = (room.name === selectedRoom);
        const boxW = w * 0.18;
        const boxH = h * 0.12;

        // ممر فرعي لكل قاعة
        ctx.strokeStyle = isTarget ? '#38bdf8' : '#1e293b';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(room.sideNode.x, room.sideNode.y);
        ctx.lineTo(room.x, room.y);
        ctx.stroke();

        // صندوق القاعة
        ctx.fillStyle = isTarget ? '#1e3a8a' : '#1e293b';
        ctx.strokeStyle = isTarget ? '#38bdf8' : '#475569';
        ctx.lineWidth = isTarget ? 2.5 : 1.5;

        ctx.fillRect(room.x - boxW / 2, room.y - boxH / 2, boxW, boxH);
        ctx.strokeRect(room.x - boxW / 2, room.y - boxH / 2, boxW, boxH);

        // اسم القاعة
        ctx.fillStyle = isTarget ? '#38bdf8' : '#94a3b8';
        ctx.font = isTarget ? 'bold 13px sans-serif' : '12px sans-serif';
        ctx.fillText(room.name, room.x, room.y + 4);
      });

      // 5. رسم المسار المسلوك عند التنقل
      if (currentPath.length > 1 && isNavigating) {
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 4;
        ctx.setLineDash([6, 6]);
        ctx.beginPath();
        ctx.moveTo(currentPath[0].x, currentPath[0].y);
        for (let i = 1; i < currentPath.length; i++) {
          ctx.lineTo(currentPath[i].x, currentPath[i].y);
        }
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // 6. رسم شخصية الطالب (Avatar)
      const drawPos = avatarPos || layout.entranceNode;
      ctx.fillStyle = '#38bdf8';
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 12;

      ctx.beginPath();
      ctx.arc(drawPos.x, drawPos.y, 9, 0, Math.PI * 2);
      ctx.fill();

      // طوق خارجي للأيقونة
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.shadowBlur = 0; // إعادة تعيين الظل

      // عنوان المبنى أعلى الشاشة
      ctx.fillStyle = '#f8fafc';
      ctx.font = 'bold 16px sans-serif';
      ctx.fillText(`مخطط: ${buildingName}`, w / 2, 30);
    }

    function startIndoorNavigation() {
      const buildingKey = document.getElementById('building-select-indoor').value;
      const selectedRoom = document.getElementById('room-select').value;
      const canvas = document.getElementById('indoor-canvas');
      const w = canvas.width;
      const h = canvas.height;

      const layout = getBuildingLayout(buildingKey, w, h);
      const targetRoom = layout.roomsLayout.find(r => r.name === selectedRoom);

      if (!targetRoom) {
        notify("يرجى اختيار القاعة أولاً.");
        return;
      }

      // بناء نقاط المسار: المدخل -> الممر الرئيسي -> الممر الفرعي -> القاعة
      currentPath = [
        layout.entranceNode,
        layout.mainIntersectionNode,
        targetRoom.sideNode,
        { x: targetRoom.x, y: targetRoom.y }
      ];

      avatarProgress = 0;
      isNavigating = true;

      cancelAnimationFrame(animationFrameId);
      animateAvatar();
    }

    function animateAvatar() {
      avatarProgress += 0.008; // سرعة حركة الشخصية

      if (avatarProgress >= 1) {
        avatarProgress = 1;
        isNavigating = false;
        const selectedRoom = document.getElementById('room-select').value;
        const currentPos = getPointOnPath(currentPath, 1);
        drawIndoorCanvas(currentPos);
        notify(`وصلت بنجاح إلى [${selectedRoom}] 🎯`);
        return;
      }

      const currentPos = getPointOnPath(currentPath, avatarProgress);
      drawIndoorCanvas(currentPos);

      animationFrameId = requestAnimationFrame(animateAvatar);
    }

    // حساب الموقع الحالي للشخصية على طول المسار
    function getPointOnPath(path, t) {
      if (path.length < 2) return path[0];

      let totalDist = 0;
      let dists = [];

      for (let i = 0; i < path.length - 1; i++) {
        let d = Math.hypot(path[i + 1].x - path[i].x, path[i + 1].y - path[i].y);
        dists.push(d);
        totalDist += d;
      }

      let travel = t * totalDist;

      for (let i = 0; i < dists.length; i++) {
        if (travel <= dists[i]) {
          let segmentT = travel / dists[i];
          return {
            x: path[i].x + (path[i + 1].x - path[i].x) * segmentT,
            y: path[i].y + (path[i + 1].y - path[i].y) * segmentT
          };
        }
        travel -= dists[i];
      }

      return path[path.length - 1];
    }

    window.onload = function() {
      initOutdoorMap();
    };
  </script>
</body>
</html>
