<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>دليل الكلية والجامعة</title>

  <!-- 1. مكتبة تلغرام المباشرة -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- 2. مكتبة Leaflet للخرائط (CSS + JS) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #ffffff);
      --text-color: var(--tg-theme-text-color, #222222);
      --button-color: var(--tg-theme-button-color, #2481cc);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
      --secondary-bg: var(--tg-theme-secondary-bg-color, #f4f4f5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .top-nav {
      display: flex;
      background-color: var(--secondary-bg);
      padding: 8px;
      gap: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      z-index: 1000;
    }

    .nav-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background-color: transparent;
      color: var(--text-color);
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .nav-btn.active {
      background-color: var(--button-color);
      color: var(--button-text);
    }

    .map-container {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
    }

    #outdoor-map {
      width: 100%;
      height: 100%;
    }

    #indoor-map {
      width: 100%;
      height: 100%;
      display: none;
      background-color: #1e1e24;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .controls-panel {
      position: absolute;
      bottom: 15px;
      left: 15px;
      right: 15px;
      background-color: var(--bg-color);
      padding: 12px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      z-index: 1000;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    select, button.action-btn {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
      background-color: var(--secondary-bg);
      color: var(--text-color);
    }

    select { flex: 1; }

    button.action-btn {
      background-color: var(--button-color);
      color: var(--button-text);
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    #indoor-canvas {
      width: 100%;
      height: 100%;
      background-color: #f8f9fa;
    }
  </style>
</head>
<body>

  <div class="top-nav">
    <button id="btn-outdoor" class="nav-btn active" onclick="switchView('outdoor')">الخارجية (الجامعة)</button>
    <button id="btn-indoor" class="nav-btn" onclick="switchView('indoor')">الداخلية (الكلية)</button>
  </div>

  <div id="outdoor-container" class="map-container">
    <div id="outdoor-map"></div>
    <div class="controls-panel">
      <button class="action-btn" onclick="locateUser()" style="width: 100%;">📍 حدد موقعي الحالي</button>
    </div>
  </div>

  <div id="indoor-container" class="map-container" style="display: none;">
    <canvas id="indoor-canvas"></canvas>
    
    <div class="controls-panel">
      <select id="destination-select">
        <option value="">اختر القاعة أو الهدف...</option>
        <option value="hall1">مدرج 1</option>
        <option value="lab_telecom">مخبر الاتصالات</option>
        <option value="dean_office">عمادة الكلية</option>
      </select>
      <button class="action-btn" onclick="startIndoorNavigation()">انطلق 🚶‍♂️</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    let map;
    let userMarker;

    // الإحداثيات الخاصة بمدخل الكلية
    const collegeLat = 35.52601940733772; 
    const collegeLng = 35.806881711117235;

    function initOutdoorMap() {
      // التمركز حول الكلية بمستوى زوم دقيق (17)
      map = L.map('outdoor-map').setView([collegeLat, collegeLng], 17);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      }).addTo(map);

      // وضع دبوس في الموقع المكتشف
      L.marker([collegeLat, collegeLng]).addTo(map)
        .bindPopup('<b>موقع الكلية الرئيسي 🏫</b>')
        .openPopup();
    }

    function locateUser() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(position => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;

          if (userMarker) map.removeLayer(userMarker);

          userMarker = L.marker([lat, lng]).addTo(map)
            .bindPopup('موقعك الحالي 📍').openPopup();

          map.setView([lat, lng], 18);
        }, () => {
          alert("تعذر تحديد الموقع، يرجى تفعيل الـ GPS في هاتفك.");
        });
      }
    }

    function switchView(view) {
      const outdoorContainer = document.getElementById('outdoor-container');
      const indoorContainer = document.getElementById('indoor-container');
      const btnOutdoor = document.getElementById('btn-outdoor');
      const btnIndoor = document.getElementById('btn-indoor');

      if (view === 'outdoor') {
        outdoorContainer.style.display = 'block';
        indoorContainer.style.display = 'none';
        btnOutdoor.classList.add('active');
        btnIndoor.classList.remove('active');
        setTimeout(() => map.invalidateSize(), 200);
      } else {
        outdoorContainer.style.display = 'none';
        indoorContainer.style.display = 'block';
        btnIndoor.classList.add('active');
        btnOutdoor.classList.remove('active');
        drawIndoorMap();
      }
    }

    function drawIndoorMap() {
      const canvas = document.getElementById('indoor-canvas');
      const ctx = canvas.getContext('2d');

      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;

      ctx.fillStyle = '#eef2f5';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#333';
      ctx.lineWidth = 4;
      ctx.strokeRect(50, 50, canvas.width - 100, canvas.height - 150);

      ctx.fillStyle = '#666';
      ctx.font = '16px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('مخطط الكلية الداخلي (سيتم وضع رسم الطبقات هنا)', canvas.width / 2, canvas.height / 2);
    }

    window.onload = function() {
      initOutdoorMap();
    };
  </script>
</body>
</html>
