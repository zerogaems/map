<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>دليل الكليات والقاعات</title>

  <!-- 1. مكتبة تلغرام -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- 2. مكتبة Leaflet للخرائط -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #ffffff);
      --text-color: var(--tg-theme-text-color, #222222);
      --button-color: var(--tg-theme-button-color, #2481cc);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
      --secondary-bg: var(--tg-theme-secondary-bg-color, #f4f4f5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    .top-nav { display: flex; background-color: var(--secondary-bg); padding: 6px; gap: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); z-index: 1000; }
    .nav-btn { flex: 1; padding: 8px; border: none; border-radius: 8px; background: transparent; color: var(--text-color); font-weight: bold; font-size: 13px; cursor: pointer; }
    .nav-btn.active { background-color: var(--button-color); color: var(--button-text); }

    .map-container { flex: 1; width: 100%; height: 100%; position: relative; }
    #outdoor-map { width: 100%; height: 100%; }
    #indoor-container { background-color: #0f172a; }

    .controls-panel {
      position: absolute; bottom: 10px; left: 10px; right: 10px;
      background-color: var(--bg-color); padding: 10px; border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 1000; display: flex; flex-direction: column; gap: 6px;
    }

    .dropdown-group { display: flex; gap: 4px; }
    select, button.action-btn { padding: 8px; border-radius: 6px; border: 1px solid #ccc; font-size: 11px; background-color: var(--secondary-bg); color: var(--text-color); }
    select { flex: 1; }

    .btn-row { display: flex; gap: 6px; }
    button.action-btn { flex: 1; background-color: var(--button-color); color: var(--button-text); border: none; font-weight: bold; cursor: pointer; }
    button.secondary-btn { background-color: var(--secondary-bg); color: var(--text-color); border: 1px solid #ccc; }

    #indoor-canvas { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>

  <div class="top-nav">
    <button id="btn-outdoor" class="nav-btn active" onclick="switchView('outdoor')">الخارجية (الجامعة)</button>
    <button id="btn-indoor" class="nav-btn" onclick="switchView('indoor')">الداخلية (الكلية)</button>
  </div>

  <div id="outdoor-container" class="map-container">
    <div id="outdoor-map"></div>
    <div class="controls-panel">
      <div class="dropdown-group">
        <select id="building-select-outdoor" onchange="focusBuildingOnMap(this.value)">
          <option value="main">🚪 المدخل الرئيسي للجامعة</option>
          <option value="hamak">1. كلية الهمك</option>
          <option value="twasaa">2. مبنى التوسع</option>
          <option value="adab">3. كلية الآداب</option>
          <option value="uloom">4. كلية العلوم</option>
        </select>
      </div>
      <button class="action-btn" id="btn-locate" onclick="locateUser()">📍 حدد موقعي وارسم المسار</button>
    </div>
  </div>

  <div id="indoor-container" class="map-container" style="display: none;">
    <canvas id="indoor-canvas"></canvas>
    
    <div class="controls-panel">
      <div class="dropdown-group">
        <select id="building-select-indoor" onchange="syncAndChangeBuilding(this.value)">
          <option value="hamak">1. كلية الهمك</option>
          <option value="twasaa">2. مبنى التوسع</option>
          <option value="adab">3. كلية الآداب</option>
          <option value="uloom">4. كلية العلوم</option>
        </select>

        <select id="floor-select" onchange="updateFloorsAndRooms()">
        </select>

        <select id="room-select" onchange="resetIndoorAnimation()">
        </select>
      </div>

      <div class="btn-row">
        <button class="action-btn" onclick="startIndoorNavigation()">انطلق نحو القاعة 🚶‍♂️</button>
        <button class="action-btn secondary-btn" style="flex: 0.35;" onclick="replayNavigation()">🔄 إعادة</button>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready(); tg.expand();

    function notify(message) { if (tg && tg.showAlert) tg.showAlert(message); else alert(message); }

    let map, userMarker, routeLine;
    let buildingMarkers = {};
    let isIndoorActive = false;

    const southWest = L.latLng(35.51958875818877, 35.80444387688746);
    const northEast = L.latLng(35.52780824158785, 35.81065192458042);
    const campusBounds = L.latLngBounds(southWest, northEast);

    const campusData = {
      main: { name: "المدخل الرئيسي للجامعة", lat: 35.52601940733772, lng: 35.806881711117235 },
      hamak: {
        name: "كلية الهمك", lat: 35.524735104049554, lng: 35.80832173303512,
        floors: {
          ground: { name: "الطابق الأرضي", rooms: ["بي 1", "بي 2", "شؤون الطلاب", "مركز الدعم"] }
        }
      },
      twasaa: {
        name: "مبنى التوسع", lat: 35.52309984997797, lng: 35.809953816186045,
        floors: { ground: { name: "الطابق الأرضي", rooms: ["مدرج 1", "مدرج 2", "مدرج 3", "مدرج 4"] } }
      },
      adab: {
        name: "كلية الآداب", lat: 35.52142722934893, lng: 35.808531572615784,
        floors: {
          ground: { name: "الطابق الأرضي", rooms: ["مدرج 1", "مدرج 2", "ق1 (بالقبو)", "ق2 (بالقبو)"] },
          basement: { name: "طابق القبو", rooms: ["ق1", "ق2"] }
        }
      },
      uloom: {
        name: "كلية العلوم", lat: 35.523082390509956, lng: 35.805570862320266,
        floors: { ground: { name: "الطابق الأرضي", rooms: ["المدرج الرابع"] } }
      }
    };

    function initOutdoorMap() {
      map = L.map('outdoor-map', { maxBounds: campusBounds, minZoom: 16, maxZoom: 19 }).setView([campusData.main.lat, campusData.main.lng], 17);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
      Object.keys(campusData).forEach(key => {
        buildingMarkers[key] = L.marker([campusData[key].lat, campusData[key].lng]).addTo(map).bindPopup(`<b>${campusData[key].name}</b>`);
      });
    }

    function locateUser() {
      const btn = document.getElementById('btn-locate');
      btn.innerText = "⏳ جاري تحديد الموقع...";
      navigator.geolocation.getCurrentPosition(
        pos => {
          btn.innerText = "📍 حدد موقعي وارسم المسار";
          const uLat = pos.coords.latitude, uLng = pos.coords.longitude;
          if (userMarker) map.removeLayer(userMarker);
          userMarker = L.marker([uLat, uLng]).addTo(map).bindPopup('موقعك 📍').openPopup();
          const bKey = document.getElementById('building-select-outdoor').value;
          if (bKey && campusData[bKey]) drawRouteLine([uLat, uLng], [campusData[bKey].lat, campusData[bKey].lng]);
        },
        () => { btn.innerText = "📍 حدد موقعي وارسم المسار"; notify("تعذر تحديد الموقع."); }
      );
    }

    function focusBuildingOnMap(key) {
      if (campusData[key]) {
        if (userMarker) drawRouteLine([userMarker.getLatLng().lat, userMarker.getLatLng().lng], [campusData[key].lat, campusData[key].lng]);
        else map.flyTo([campusData[key].lat, campusData[key].lng], 18);
        buildingMarkers[key].openPopup();
      }
    }

    function drawRouteLine(from, to) {
      if (routeLine) map.removeLayer(routeLine);
      routeLine = L.polyline([from, to], { color: '#2481cc', weight: 4, dashArray: '8, 8' }).addTo(map);
    }

    function syncAndChangeBuilding(key) {
      document.getElementById('building-select-outdoor').value = key;
      updateFloorsAndRooms();
    }

    function updateFloorsAndRooms() {
      const bKey = document.getElementById('building-select-indoor').value;
      const fSel = document.getElementById('floor-select');
      const rSel = document.getElementById('room-select');
      const bInfo = campusData[bKey];

      if (fSel.getAttribute('data-building') !== bKey) {
        fSel.innerHTML = ''; fSel.setAttribute('data-building', bKey);
        Object.keys(bInfo.floors).forEach(f => {
          let opt = document.createElement('option'); opt.value = f; opt.textContent = bInfo.floors[f].name; fSel.appendChild(opt);
        });
      }

      const fKey = fSel.value || Object.keys(bInfo.floors)[0];
      rSel.innerHTML = '';
      if (bInfo.floors[fKey]) {
        bInfo.floors[fKey].rooms.forEach(r => {
          let opt = document.createElement('option'); opt.value = r; opt.textContent = r; rSel.appendChild(opt);
        });
      }
      resetIndoorAnimation();
    }

    function switchView(view) {
      document.getElementById('outdoor-container').style.display = (view === 'outdoor') ? 'block' : 'none';
      document.getElementById('indoor-container').style.display = (view === 'indoor') ? 'block' : 'none';
      document.getElementById('btn-outdoor').classList.toggle('active', view === 'outdoor');
      document.getElementById('btn-indoor').classList.toggle('active', view === 'indoor');
      if (view === 'indoor') updateFloorsAndRooms();
      else setTimeout(() => map.invalidateSize(), 150);
    }

    /* -------------------------------------------------------------
       رسم المخططات البرمجية لمباني الكليات
    ------------------------------------------------------------- */
    let animationFrameId, avatarProgress = 0, isNavigating = false, currentPath = [];

    function resetIndoorAnimation() { cancelAnimationFrame(animationFrameId); avatarProgress = 0; isNavigating = false; drawIndoorCanvas(); }
    function replayNavigation() { startIndoorNavigation(); }

    function drawIndoorCanvas(avatarPos = null) {
      const canvas = document.getElementById('indoor-canvas');
      const ctx = canvas.getContext('2d');
      const bKey = document.getElementById('building-select-indoor').value;
      const fKey = document.getElementById('floor-select').value || 'ground';
      const selectedRoom = document.getElementById('room-select').value;

      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
      const w = canvas.width, h = canvas.height;

      ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, w, h);

      if (bKey === 'twasaa') drawTwasaa(ctx, w, h, selectedRoom, avatarPos);
      else if (bKey === 'uloom') drawUloom(ctx, w, h, selectedRoom, avatarPos);
      else if (bKey === 'adab') drawAdab(ctx, w, h, fKey, selectedRoom, avatarPos);
      else if (bKey === 'hamak') drawHamakGround(ctx, w, h, selectedRoom, avatarPos);

      ctx.fillStyle = '#f8fafc'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(`${campusData[bKey].name} - ${campusData[bKey].floors[fKey]?.name || ''}`, w / 2, 25);
    }

    // 1. رسم التوسع
    function drawTwasaa(ctx, w, h, selectedRoom, avatarPos) {
      const entrance = { x: w * 0.50, y: h * 0.68 };
      ctx.strokeStyle = '#334155'; ctx.lineWidth = w * 0.07; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(w*0.5, h*0.68); ctx.lineTo(w*0.5, h*0.60); ctx.stroke();
      ctx.beginPath(); ctx.strokeRect(w*0.22, h*0.35, w*0.56, h*0.25);
      ctx.beginPath(); ctx.moveTo(w*0.5, h*0.35); ctx.lineTo(w*0.5, h*0.10); ctx.stroke();

      ctx.fillStyle = '#14532d'; ctx.fillRect(w*0.35, h*0.38, w*0.30, h*0.19);
      ctx.fillStyle = '#86efac'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('حديقة عامة 🌿', w*0.5, h*0.48);

      const rooms = [
        { name: "مدرج 1", x: w*0.88, y: h*0.55 }, { name: "مدرج 2", x: w*0.88, y: h*0.40 },
        { name: "مدرج 3", x: w*0.72, y: h*0.26 }, { name: "مدرج 4", x: w*0.72, y: h*0.14 }
      ];
      rooms.forEach(r => {
        let isT = (r.name === selectedRoom);
        ctx.fillStyle = isT ? '#1e3a8a' : '#1e293b'; ctx.strokeStyle = isT ? '#38bdf8' : '#475569';
        ctx.fillRect(r.x-25, r.y-12, 50, 24); ctx.strokeRect(r.x-25, r.y-12, 50, 24);
        ctx.fillStyle = isT ? '#38bdf8' : '#94a3b8'; ctx.fillText(r.name, r.x, r.y+4);
      });
      drawAvatarAndPath(ctx, entrance, avatarPos);
    }

    // 2. رسم العلوم (المدرج الرابع والأدراج)
    function drawUloom(ctx, w, h, selectedRoom, avatarPos) {
      const entrance = { x: w * 0.35, y: h * 0.68 };
      ctx.strokeStyle = '#334155'; ctx.lineWidth = w * 0.06;
      ctx.beginPath(); ctx.strokeRect(w*0.20, h*0.50, w*0.30, h*0.18); // حديقة سفلية
      ctx.beginPath(); ctx.moveTo(w*0.50, h*0.59); ctx.lineTo(w*0.50, h*0.38); ctx.stroke(); // ممر الدرج 1
      ctx.beginPath(); ctx.strokeRect(w*0.35, h*0.25, w*0.40, h*0.13); // ساحة الحمامات
      ctx.beginPath(); ctx.moveTo(w*0.75, h*0.30); ctx.lineTo(w*0.75, h*0.12); ctx.stroke();

      // أدراج باللون البرتقالي
      ctx.fillStyle = '#f97316'; ctx.fillRect(w*0.48, h*0.46, 12, 16); ctx.fillRect(w*0.53, h*0.30, 16, 12); ctx.fillRect(w*0.72, h*0.20, 12, 16);

      // خدمات
      ctx.fillStyle = '#334155'; ctx.fillRect(w*0.55, h*0.52, 40, 18);
      ctx.fillStyle = '#94a3b8'; ctx.font = '9px sans-serif'; ctx.fillText('كافيه', w*0.62, h*0.55);

      let isT = (selectedRoom === "المدرج الرابع");
      ctx.fillStyle = isT ? '#1e3a8a' : '#1e293b'; ctx.strokeStyle = isT ? '#38bdf8' : '#475569';
      ctx.fillRect(w*0.40, h*0.10, 70, 26); ctx.strokeRect(w*0.40, h*0.10, 70, 26);
      ctx.fillStyle = isT ? '#38bdf8' : '#94a3b8'; ctx.fillText('المدرج الرابع', w*0.50, h*0.13);

      drawAvatarAndPath(ctx, entrance, avatarPos);
    }

    // 3. رسم الآداب (الأرضي والقبو)
    function drawAdab(ctx, w, h, fKey, selectedRoom, avatarPos) {
      const entrance = { x: w * 0.50, y: h * 0.68 };
      if (fKey === 'ground') {
        ctx.strokeStyle = '#334155'; ctx.lineWidth = w * 0.06;
        ctx.beginPath(); ctx.moveTo(w*0.5, h*0.68); ctx.lineTo(w*0.5, h*0.20); ctx.stroke();
        ctx.beginPath(); ctx.strokeRect(w*0.25, h*0.35, w*0.35, h*0.20);

        // مدرج 1 و 2
        let r1 = (selectedRoom === "مدرج 1"), r2 = (selectedRoom === "مدرج 2");
        ctx.fillStyle = r1 ? '#1e3a8a' : '#1e293b'; ctx.fillRect(w*0.75, h*0.45, 50, 22);
        ctx.fillStyle = r2 ? '#1e3a8a' : '#1e293b'; ctx.fillRect(w*0.12, h*0.40, 50, 22);

        // درج القبو
        ctx.fillStyle = '#a855f7'; ctx.fillRect(w*0.45, h*0.15, 30, 25);
        ctx.fillStyle = '#ffffff'; ctx.font = '9px sans-serif'; ctx.fillText('درج القبو 🪜', w*0.5, h*0.18);
      } else {
        // طابق القبو
        ctx.strokeStyle = '#334155'; ctx.lineWidth = w * 0.06;
        ctx.beginPath(); ctx.moveTo(w*0.5, h*0.15); ctx.lineTo(w*0.5, h*0.40); ctx.lineTo(w*0.25, h*0.40); ctx.stroke();
        ctx.beginPath(); ctx.strokeRect(w*0.20, h*0.45, w*0.45, h*0.22);

        let q1 = (selectedRoom === "ق1"), q2 = (selectedRoom === "ق2");
        ctx.fillStyle = q1 ? '#1e3a8a' : '#1e293b'; ctx.fillRect(w*0.38, h*0.40, 40, 20);
        ctx.fillStyle = q2 ? '#1e3a8a' : '#1e293b'; ctx.fillRect(w*0.12, h*0.52, 40, 20);
      }
      drawAvatarAndPath(ctx, entrance, avatarPos);
    }

    // 4. رسم الهمك - الأرضي (الأدراج الأربعة والخدمات)
    function drawHamakGround(ctx, w, h, selectedRoom, avatarPos) {
      const entrance = { x: w * 0.20, y: h * 0.68 };
      ctx.strokeStyle = '#334155'; ctx.lineWidth = w * 0.06;
      ctx.beginPath(); ctx.moveTo(w*0.20, h*0.68); ctx.lineTo(w*0.20, h*0.35); ctx.lineTo(w*0.70, h*0.35); ctx.stroke();
      ctx.beginPath(); ctx.strokeRect(w*0.65, h*0.20, w*0.28, h*0.30); // الساحة الأخيرة

      // الأدراج الأربعة
      ctx.fillStyle = '#f97316';
      ctx.fillRect(w*0.28, h*0.60, 12, 16); ctx.fillText('د1', w*0.30, h*0.63);
      ctx.fillRect(w*0.35, h*0.30, 16, 12); ctx.fillText('د2', w*0.37, h*0.28);
      ctx.fillRect(w*0.60, h*0.38, 16, 12); ctx.fillText('د3', w*0.62, h*0.41);
      ctx.fillRect(w*0.88, h*0.32, 12, 16); ctx.fillText('د4', w*0.90, h*0.35);

      // الكلية المدنية (كتلة جدارية)
      ctx.fillStyle = '#475569'; ctx.fillRect(w*0.05, h*0.40, 45, 60);
      ctx.fillStyle = '#ffffff'; ctx.font = '9px sans-serif'; ctx.fillText('المدنية', w*0.12, h*0.48);

      // القاعات B1 و B2 وشؤون الطلاب ومركز الدعم
      const rooms = [
        { name: "بي 1", x: w*0.60, y: h*0.18 }, { name: "بي 2", x: w*0.60, y: h*0.26 },
        { name: "شؤون الطلاب", x: w*0.78, y: h*0.12 }, { name: "مركز الدعم", x: w*0.78, y: h*0.52 }
      ];
      rooms.forEach(r => {
        let isT = (r.name === selectedRoom);
        ctx.fillStyle = isT ? '#1e3a8a' : '#1e293b'; ctx.strokeStyle = isT ? '#38bdf8' : '#475569';
        ctx.fillRect(r.x-25, r.y-10, 50, 20); ctx.strokeRect(r.x-25, r.y-10, 50, 20);
        ctx.fillStyle = isT ? '#38bdf8' : '#94a3b8'; ctx.fillText(r.name, r.x, r.y+4);
      });

      drawAvatarAndPath(ctx, entrance, avatarPos);
    }

    function drawAvatarAndPath(ctx, entrance, avatarPos) {
      if (currentPath.length > 1 && isNavigating) {
        ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 3; ctx.setLineDash([4, 4]);
        ctx.beginPath(); ctx.moveTo(currentPath[0].x, currentPath[0].y);
        for (let i = 1; i < currentPath.length; i++) ctx.lineTo(currentPath[i].x, currentPath[i].y);
        ctx.stroke(); ctx.setLineDash([]);
      }
      const drawPos = avatarPos || entrance;
      ctx.fillStyle = '#38bdf8'; ctx.beginPath(); ctx.arc(drawPos.x, drawPos.y, 7, 0, Math.PI * 2); ctx.fill();
    }

    function startIndoorNavigation() {
      const bKey = document.getElementById('building-select-indoor').value;
      const selectedRoom = document.getElementById('room-select').value;
      const canvas = document.getElementById('indoor-canvas');
      const w = canvas.width, h = canvas.height;

      // توليد المسارات التفصيلية بناءً على القاعة المختارة
      if (bKey === 'twasaa') {
        const ent = { x: w * 0.50, y: h * 0.68 };
        if (selectedRoom === "مدرج 1") currentPath = [ent, { x: w*0.5, y: h*0.55 }, { x: w*0.88, y: h*0.55 }];
        else if (selectedRoom === "مدرج 2") currentPath = [ent, { x: w*0.5, y: h*0.40 }, { x: w*0.88, y: h*0.40 }];
        else if (selectedRoom === "مدرج 3") currentPath = [ent, { x: w*0.5, y: h*0.26 }, { x: w*0.72, y: h*0.26 }];
        else if (selectedRoom === "مدرج 4") currentPath = [ent, { x: w*0.5, y: h*0.14 }, { x: w*0.72, y: h*0.14 }];
      } else if (bKey === 'uloom') {
        currentPath = [{ x: w * 0.35, y: h * 0.68 }, { x: w * 0.50, y: h * 0.59 }, { x: w * 0.50, y: h * 0.30 }, { x: w * 0.75, y: h * 0.30 }, { x: w * 0.75, y: h * 0.13 }, { x: w * 0.50, y: h * 0.13 }];
      } else if (bKey === 'adab') {
        const fKey = document.getElementById('floor-select').value;
        if (fKey === 'ground') {
          if (selectedRoom.includes("قبو")) currentPath = [{ x: w * 0.5, y: h * 0.68 }, { x: w * 0.5, y: h * 0.18 }];
          else if (selectedRoom === "مدرج 1") currentPath = [{ x: w * 0.5, y: h * 0.68 }, { x: w * 0.5, y: h * 0.45 }, { x: w * 0.75, y: h * 0.45 }];
          else currentPath = [{ x: w * 0.5, y: h * 0.68 }, { x: w * 0.5, y: h * 0.40 }, { x: w * 0.12, y: h * 0.40 }];
        } else {
          if (selectedRoom === "ق1") currentPath = [{ x: w * 0.5, y: h * 0.15 }, { x: w * 0.5, y: h * 0.40 }, { x: w * 0.38, y: h * 0.40 }];
          else currentPath = [{ x: w * 0.5, y: h * 0.15 }, { x: w * 0.5, y: h * 0.40 }, { x: w * 0.25, y: h * 0.40 }, { x: w * 0.25, y: h * 0.52 }, { x: w * 0.12, y: h * 0.52 }];
        }
      } else if (bKey === 'hamak') {
        const ent = { x: w * 0.20, y: h * 0.68 };
        if (selectedRoom === "بي 1") currentPath = [ent, { x: w*0.2, y: h*0.35 }, { x: w*0.6, y: h*0.35 }, { x: w*0.6, y: h*0.18 }];
        else if (selectedRoom === "بي 2") currentPath = [ent, { x: w*0.2, y: h*0.35 }, { x: w*0.6, y: h*0.35 }, { x: w*0.6, y: h*0.26 }];
        else if (selectedRoom === "شؤون الطلاب") currentPath = [ent, { x: w*0.2, y: h*0.35 }, { x: w*0.78, y: h*0.35 }, { x: w*0.78, y: h*0.12 }];
        else if (selectedRoom === "مركز الدعم") currentPath = [ent, { x: w*0.2, y: h*0.35 }, { x: w*0.78, y: h*0.35 }, { x: w*0.78, y: h*0.52 }];
      }

      avatarProgress = 0; isNavigating = true;
      cancelAnimationFrame(animationFrameId); animateAvatar();
    }

    function animateAvatar() {
      avatarProgress += 0.004;
      if (avatarProgress >= 1) {
        avatarProgress = 1; isNavigating = false;
        drawIndoorCanvas(getPointOnPath(currentPath, 1));
        notify(`وصلت إلى [${document.getElementById('room-select').value}] 🎯`);
        return;
      }
      drawIndoorCanvas(getPointOnPath(currentPath, avatarProgress));
      animationFrameId = requestAnimationFrame(animateAvatar);
    }

    function getPointOnPath(path, t) {
      if (path.length < 2) return path[0];
      let totalDist = 0, dists = [];
      for (let i = 0; i < path.length - 1; i++) {
        let d = Math.hypot(path[i + 1].x - path[i].x, path[i + 1].y - path[i].y);
        dists.push(d); totalDist += d;
      }
      let travel = t * totalDist;
      for (let i = 0; i < dists.length; i++) {
        if (travel <= dists[i]) {
          let segT = travel / dists[i];
          return { x: path[i].x + (path[i + 1].x - path[i].x) * segT, y: path[i].y + (path[i + 1].y - path[i].y) * segT };
        }
        travel -= dists[i];
      }
      return path[path.length - 1];
    }

    window.onload = function() { initOutdoorMap(); };
  </script>
</body>
